name: IPA
on:
  workflow_dispatch:
  push:
    paths: ["ios/**", ".github/workflows/ipa.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        working-directory: ios
        run: |
          set -e
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::Нет Xcode 26"; exit 1; }
          sudo xcode-select -s "$X"; echo "::notice::$X"
          APP=Payload/Pary.app
          mkdir -p $APP
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          if ! xcrun --sdk iphoneos swiftc -O -sdk "$SDK" -target arm64-apple-ios15.0 main.swift -o $APP/Pary > build.log 2>&1; then grep -E "error" build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
          cp Info.plist $APP/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" $APP/Info.plist
          plutil -replace DTSDKName -string "iphoneos" $APP/Info.plist
          plutil -remove CFBundleIcons $APP/Info.plist
          plutil -remove 'CFBundleIcons~ipad' $APP/Info.plist
          xcrun actool AppIcon.icon --compile $APP --platform iphoneos --minimum-deployment-target 15.0 --app-icon AppIcon --target-device iphone --target-device ipad --output-partial-info-plist partial.plist > icon.log 2>&1 || { sed 's/^/::error::/' icon.log | head -20; exit 1; }
          [ -f $APP/Assets.car ] || { echo "::error::Assets.car не создан"; sed 's/^/::error::/' icon.log | head -20; exit 1; }
          /usr/libexec/PlistBuddy -c "Merge partial.plist" $APP/Info.plist
          printf 'APPL????' > $APP/PkgInfo
          zip -qr ../pary-e21.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: pary-e21-ipa, path: pary-e21.ipa }
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete ipa --yes --cleanup-tag || true
          gh release create ipa pary-e21.ipa --title "Пары Е-21 для iPad" --notes "Сборка ${{ github.run_number }}. Без подписи: ставить через Sideloadly или AltStore."
