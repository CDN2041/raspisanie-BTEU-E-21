name: APK
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/apk.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build
        working-directory: android
        env:
          KS_PASS: "nNwDXkoio-Lakuun2d0lfqsZ"
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export KS_FILE="$PWD/pary.jks"
          if ! gradle assembleRelease --no-daemon > build.log 2>&1; then grep -E "rror|wrong|>|FAIL" build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
          cp app/build/outputs/apk/release/app-release.apk ../pary-e21.apk
      - uses: actions/upload-artifact@v4
        with: { name: pary-e21-apk, path: pary-e21.apk }
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk pary-e21.apk --title "Пары Е-21 для Android" --notes "Сборка ${{ github.run_number }}"
