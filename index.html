<style>
/* Layout: одна колонка как приложение, шапка с меткой недели (точка над/под чертой), лента дней, карточки пар */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --fg:#141821; --muted:#646C7E; --line:#D7DBE4;
  --accent:#2B47C4; --accent-soft:#E2E7FA; --lec:#2462C9; --lec-soft:#E1ECFB;
  --prac:#13805E; --prac-soft:#DDF2EA; --other:#7A5A12; --other-soft:#F4ECD9; --warn:#B4231B; --note:#A86A12; --note-soft:#FBF0DC;
  --font-d:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-b:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050608; --surface:#101318; --fg:#E8EBF1; --muted:#8B93A5; --line:#1F242D;
  --accent:#8FA3FF; --accent-soft:#222B4A; --lec:#79A8FF; --lec-soft:#1C2A44;
  --prac:#52CC9F; --prac-soft:#163A2F; --other:#E3BE6B; --other-soft:#3A2F17; --warn:#FF7A70; --note:#E8A94B; --note-soft:#21180A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050608; --surface:#101318; --fg:#E8EBF1; --muted:#8B93A5; --line:#1F242D;
  --accent:#8FA3FF; --accent-soft:#222B4A; --lec:#79A8FF; --lec-soft:#1C2A44;
  --prac:#52CC9F; --prac-soft:#163A2F; --other:#E3BE6B; --other-soft:#3A2F17; --warn:#FF7A70; --note:#E8A94B; --note-soft:#21180A; color-scheme:dark}

html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--font-d);font-weight:700;font-size:28px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
.group{font-family:var(--font-m);font-size:13px;color:var(--muted);margin-top:6px}
.mark{flex:none;width:64px;height:52px;border-radius:14px;background:var(--surface);display:grid;place-items:center;border:1px solid var(--line)}
.mark svg{display:block}
.mark{color:var(--accent);padding:0}

.weeknav{display:flex;align-items:center;gap:8px}
.navbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:36px;font-size:18px;line-height:1}
.range{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.today{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:0 12px;height:36px;font-weight:600}

.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{border:1px solid transparent;background:transparent;border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day .dn{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.day .dd{font-family:var(--font-m);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.day .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.is-today .dd{color:var(--accent)}
.day.has-note{background:var(--note-soft)}
.day.has-note .dd,.day.has-note .cnt{color:var(--note)}
.day.has-note.sel{border-color:var(--note);background:var(--note-soft)}
.day.sel{background:var(--surface);border-color:var(--line)}

.status{font-weight:600;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.lesson{display:grid;grid-template-columns:62px 1fr;gap:12px;background:var(--surface);border-radius:16px;padding:14px;border:1px solid var(--line)}
.lesson.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lesson.past{opacity:.55}
.time{display:flex;flex-direction:column;font-family:var(--font-m);font-variant-numeric:tabular-nums}
.time .pn{font-size:11px;color:var(--muted);font-family:var(--font-b);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.time b{font-size:17px}
.time span{font-size:13px;color:var(--muted)}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.t-lec{background:var(--lec-soft);color:var(--lec)}
.t-prac{background:var(--prac-soft);color:var(--prac)}
.t-other{background:var(--other-soft);color:var(--other)}
.t-wk{background:transparent;color:var(--muted);border:1px solid var(--line)}
.t-new{background:var(--accent-soft);color:var(--accent)}
.subj{font-weight:600;font-size:16px;line-height:1.3;margin:0;overflow-wrap:anywhere}
.who{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.room{font-family:var(--font-m);font-size:13px}
.room small{font-family:var(--font-b);color:var(--muted);font-size:12px}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar2{display:flex;gap:3px;margin-top:6px}
.bar2 .seg{height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:block}
.bar2 .seg i{display:block;height:100%;background:var(--accent)}
.bar2 .brk{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.bar2 .brk i{background:var(--muted)}
.left{font-size:12px;color:var(--accent);font-weight:600}
.gap{font-size:13px;color:var(--muted);text-align:center;padding:2px 0;display:flex;align-items:center;gap:10px}
.gap::before,.gap::after{content:"";flex:1;border-top:1px dashed var(--line)}
.gap.on{color:var(--accent);font-weight:600}
.pm{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;padding:0 14px;font-size:12px;color:var(--muted);margin-block:-4px}
.pm-l{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.pm.on{color:var(--accent);font-weight:600}
.pm{position:relative;padding-block:6px;margin-block:-3px;border-radius:10px;overflow:hidden;border:1px dashed var(--line)}
.pm.on{border:1px solid var(--accent)}
.pm-l,.pm-t{position:relative}
.pm-fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--muted) 14%,transparent)}
.pm.on .pm-fill{background:var(--accent-soft)}
.pm-bar{padding:0 14px 0 88px;margin-top:-6px}
.big{display:flex;gap:12px;align-items:center;background:transparent;color:var(--muted);border:1px dashed var(--line);border-radius:16px;padding:12px 14px}

.big-i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--bg)}
.big-i svg{width:20px;height:20px}
.big-b{flex:1;min-width:0}
.big-r{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.big-r b{font-weight:600;font-size:15px}
.big-r span{font-size:13px;font-weight:600;white-space:nowrap}
.big-s{font-family:var(--font-m);font-size:12px;opacity:.8}
.big{position:relative;overflow:hidden}
.big>*:not(.big-fill){position:relative}
.big-fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--muted) 16%,transparent)}
.big.on .big-fill{background:var(--other-soft)}
.big.lit{color:var(--other);border-style:solid;border-color:transparent}
.big.on{border-color:var(--other)}
.empty{text-align:center;color:var(--muted);padding:40px 12px;background:var(--surface);border-radius:16px;border:1px solid var(--line)}
.empty b{display:block;font-family:var(--font-d);font-weight:500;color:var(--fg);font-size:18px;margin-bottom:4px}

.lesson{position:relative}
.lesson:has(.pen) .body{padding-right:34px}
.lesson.has-note{background:var(--note-soft);border-color:var(--note)}
.lesson.has-note.now{box-shadow:0 0 0 1px var(--note)}
.pen{position:absolute;top:8px;right:8px;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:grid;place-items:center}
.pen svg{width:20px;height:20px}
.has-note .pen{color:var(--note)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.panel{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;box-sizing:border-box;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.panel h2{font-family:var(--font-d);font-weight:500;font-size:19px;margin:0;line-height:1.25;overflow-wrap:anywhere}
.nsub{color:var(--muted);font-size:14px;margin-top:4px}
#ntext{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;box-sizing:border-box;min-height:140px;resize:vertical}
.actions{display:flex;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:600;flex:1}
.btn.primary{background:var(--note);color:var(--bg)}
.btn.ghost{background:var(--bg);border:1px solid var(--line)}
.btn.del{flex:0 0 auto;background:transparent;color:var(--warn);border:1px solid var(--line)}
.wpanel{max-height:80%;overflow:hidden}
.wlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:0 -4px;padding:0 4px;-webkit-overflow-scrolling:touch}
.wk{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px}
.wk b{font-weight:600;font-variant-numeric:tabular-nums}
.wk span{color:var(--muted);font-size:13px;white-space:nowrap}
.wk.cur span{color:var(--accent);font-weight:600}
.wk.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cdlg{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding-inline:24px}
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:320px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px}
.cbox b{font-size:17px}
.cbox p{margin:0 0 10px;color:var(--muted);font-size:14px}
.btn.danger{background:var(--warn);color:var(--bg)}
.links{display:flex;justify-content:center;gap:10px;margin-top:12px}
.links a{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:13px;font-weight:500}
.links a:active{background:var(--surface)}
.links svg{width:16px;height:16px}
@media (prefers-reduced-motion: no-preference){.lesson,.day{transition:background .15s,border-color .15s}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <div class="eyebrow" id="rel">эта неделя</div>
      <h1 id="wtitle">Под чертой</h1>
    </div>
    <button class="mark" id="mark" aria-label="Выбрать неделю"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg></button>
  </header>

  <div class="weeknav">
    <button class="navbtn" id="prev" aria-label="Предыдущая неделя">‹</button>
    <div class="range" id="range"></div>

  <nav class="days" id="days"></nav>
  <section class="list" id="list"></section>

  <footer class="links">
    <a href="https://github.com/CDN2041" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/></svg><span>GitHub</span></a>
    <a href="https://t.me/cdn2041" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4 3 11l6 2.5M21 4l-4 16-8-6.5M21 4 9 13.5V19l3-3.5"/></svg><span>Telegram</span></a>
  </footer>

</div>

<div class="sheet" id="wsheet" hidden>
  <div class="panel wpanel" role="dialog" aria-labelledby="wt">
    <h2 id="wt">Выбор недели</h2>
    <div class="wlist" id="wlist"></div>
    <div class="actions"><button type="button" class="btn ghost" id="wclose">Закрыть</button></div>
  </div>
</div>

<div class="cdlg" id="cdlg" hidden>

    <div class="actions">
      <button type="button" class="btn ghost" id="cno">Отмена</button>
      <button type="button" class="btn danger" id="cyes">Удалить</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-labelledby="nt">
    <div><h2 id="nt">Заметка</h2><div class="nsub" id="nsub"></div></div>
    <textarea id="ntext" placeholder="Например: сдать реферат, взять методичку"></textarea>
    <div class="actions">
      <button type="button" class="btn del" id="ndel">Удалить</button>
      <button type="button" class="btn ghost" id="ncancel">Отмена</button>
      <button type="button" class="btn primary" id="nsave">Сохранить</button>
    </div>
  </div>
</div>

<script>
(function(){
// Неделя с понедельника 19.10.2026 = "под чертой", дальше чередуется
var ANCHOR = new Date(2026,9,19);
var PAIRS = [null,["9:00","10:35"],["10:50","12:25"],["12:55","14:30"],["14:40","16:15"],["16:25","18:00"]];
var DAYS = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];

// t: "lec" лекция, "prac" практика, "other" другое; from: с какой даты пара начинается (необязательно)

 // Понедельник
 {d:0,p:1,w:"over", s:"Философия", t:"prac", tch:"доц. Малахов Д. В.", r:"4-20"},

 // Вторник
 {d:1,p:1,w:"all",  s:"Макроэкономика", t:"lec", tch:"ст. пр. Чернявский М. Р.", r:"1-10"},
 {d:1,p:2,w:"over", s:"Макроэкономика", t:"prac", tch:"пр.-ст. Адасенко А. И.", r:"4-25"},
 {d:1,p:2,w:"under",s:"Трудовое право", t:"prac", tch:"доц. Сныткова Н. А.", r:"3-11", from:"2026-09-22"},

 {d:1,p:3,w:"under",s:"Философия", t:"prac", tch:"доц. Малахов Д. В.", r:"1-22", from:"2026-09-22"},
 {d:1,p:4,w:"all",  s:"Психология управления", t:"prac", tch:"ст. пр. Дворкина М. А.", r:"4-25"},
 // Среда
 {d:2,p:1,w:"over", s:"Трудовое право", t:"lec", tch:"доц. Сныткова Н. А.", r:"3-11"},
 {d:2,p:1,w:"under",s:"Макроэкономика", t:"lec", tch:"ст. пр. Чернявский М. Р.", r:"1-6", from:"2026-09-23"},
 {d:2,p:2,w:"all",  s:FK, t:"prac", tch:FKT, r:""},
 {d:2,p:3,w:"all",  s:"Философия", t:"lec", tch:"доц. Малахов Д. В.", r:"1-10"},
 {d:2,p:4,w:"over", s:EO, t:"prac", tch:"асс. Черней А. Д.", r:"4-12"},
 // Четверг
 {d:3,p:1,w:"over", s:"Макроэкономика", t:"prac", tch:"пр.-ст. Адасенко А. И.", r:"1-25"},
 {d:3,p:2,w:"over", s:"Трудовое право", t:"prac", tch:"доц. Сныткова Н. А.", r:"3-11"},
 {d:3,p:2,w:"under",s:"Трудовое право", t:"lec", tch:"доц. Сныткова Н. А.", r:"3-11", from:"2026-09-24"},
 {d:3,p:3,w:"over", s:KD, t:"lec", tch:"ст. пр. Матвейчик М. Г.", r:"1-13"},
 {d:3,p:3,w:"under",s:KD, t:"prac", tch:"ст. пр. Матвейчик М. Г.", r:"3-16, 5-18", from:"2026-09-24"},
 {d:3,p:4,w:"all",  s:PO, t:"lec", tch:"ст. пр. Батура С. П.", r:"1-22", from:"2026-10-22"},
 {d:3,p:5,w:"under",s:PO, t:"prac", tch:"ст. пр. Батура С. П.", r:"1-25", from:"2026-10-22"},
 // Пятница
 {d:4,p:1,w:"under",s:"Конфликтология", t:"prac", tch:"ст. пр. Дворкина М. А.", r:"1-13", from:"2026-09-25"},
 {d:4,p:2,w:"over", s:KD, t:"prac", tch:"ст. пр. Матвейчик М. Г.", r:"5-9"},
 {d:4,p:2,w:"under",s:"Макроэкономика", t:"prac", tch:"пр.-ст. Адасенко А. И.", r:"5-23", from:"2026-09-25"},
 {d:4,p:3,w:"over", s:"Конфликтология", t:"prac", tch:"ст. пр. Дворкина М. А.", r:"5-28"},
 {d:4,p:3,w:"under",s:KD, t:"lec", tch:"ст. пр. Матвейчик М. Г.", r:"1-28", from:"2026-09-25"},
 {d:4,p:4,w:"all",  s:"Психология управления", t:"lec", tch:"ст. пр. Дворкина М. А.", r:"1-28"},
 {d:4,p:5,w:"over", s:PO, t:"prac", tch:"ст. пр. Батура С. П.", r:"1-22", from:"2026-10-30"},
 // Суббота
 {d:5,p:1,w:"all",  s:"Теоретические основы менеджмента", t:"lec", tch:"доц. Климович Л. К.", r:"5-18"},
 {d:5,p:2,w:"all",  s:"Теоретические основы менеджмента", t:"prac", tch:"доц. Климович Л. К.", r:"5-18"},
 {d:5,p:3,w:"over", s:PO, t:"lec", tch:"ст. пр. Батура С. П.", r:"1-10", from:"2026-10-31"},
 {d:5,p:3,w:"under",s:"Противодействие коррупции", t:"prac", tch:"пр. Печура А. Ф.", r:"5-18", from:"2026-09-26"}
];

var lessons=DEFAULT;
var NKEY="pary-notes-v1", notes={};
try{notes=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};}catch(e){notes={};}
function saveNotes(){try{localStorage.setItem(NKEY,JSON.stringify(notes));}catch(e){}}
var PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

function day0(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function mondayOf(d){var x=day0(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function weeksBetween(a,b){return Math.round((mondayOf(b)-mondayOf(a))/864e5/7);}
function weekType(d){var n=weeksBetween(ANCHOR,d);return (((n%2)+2)%2)===0?"under":"over";}
function key(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;}
function toMin(t){var a=t.split(":");return +a[0]*60+ +a[1];}
function dur(m){var h=Math.floor(m/60),mm=m%60;return (h?h+" ч ":"")+(mm||!h?mm+" мин":"").trim();}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
var MONF=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

function lessonsFor(d){
  var wd=(d.getDay()+6)%7; if(wd>5)return [];
  var wt=weekType(d), k=key(d);
  return lessons.filter(function(l){return l.d===wd&&(l.w==="all"||l.w===wt)&&(!l.from||k>=l.from);})
    .sort(function(a,b){return a.p-b.p;});
}

var now=new Date(), sel=day0(now);
if(sel.getDay()===0)sel.setDate(sel.getDate()+1);

function markSvg(wt){
  var cy=wt==="over"?13:35;
  return '<svg width="44" height="48" viewBox="0 0 44 48"><line x1="4" y1="24" x2="40" y2="24" stroke="var(--fg)" stroke-width="2.5" stroke-linecap="round"/><circle cx="22" cy="'+cy+'" r="6" fill="var(--accent)"/></svg>';
}

var CUP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5Z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3v3M12 3v3"/></svg>';
function gapHtml(kind,gs,ge){
  var t=new Date(), m=t.getHours()*60+t.getMinutes();
  var on=sel.getTime()===day0(t).getTime()&&m>=gs&&m<ge;
  var pc=on?Math.round((m-gs)/(ge-gs)*100):0;
  var bar=on?'<div class="bar"><i style="width:'+pc+'%"></i></div>':'';
  var fmt=function(x){return Math.floor(x/60)+":"+(x%60<10?"0":"")+x%60;};
  if(kind==="small"){
    var td0=day0(t).getTime(), sd0=sel.getTime();
    var sp=sd0<td0?100:sd0>td0?0:Math.max(0,Math.min(100,(m-gs)/(ge-gs)*100));
    return '<div class="pm'+(on?" on":"")+'"><span class="pm-fill" style="width:'+sp.toFixed(1)+'%"></span><span class="pm-l">'+dur(ge-gs)+'</span><span class="pm-t">'+(on?"Перерыв, ещё "+dur(ge-m):"Перерыв")+'</span></div>';
  }
  if(kind==="big"){
    var td=day0(t).getTime(), sd=sel.getTime();
    var bp=sd<td?100:sd>td?0:Math.max(0,Math.min(100,Math.round((m-gs)/(ge-gs)*100)));
    bar='';
    return '<div class="big'+(on?" on":"")+(on?" lit":"")+'"><span class="big-fill" style="width:'+bp+'%"></span><span class="big-i">'+CUP+'</span><div class="big-b"><div class="big-r"><b>Большой перерыв</b><span>'+(on?"ещё "+dur(ge-m):dur(ge-gs))+'</span></div><div class="big-s">'+fmt(gs)+' - '+fmt(ge)+'</div>'+bar+'</div></div>';
  }
  return '<div class="gap'+(on?" on":"")+'"><span>Окно '+dur(ge-gs)+(on?", ещё "+dur(ge-m):"")+'</span></div>'+(on?'<div class="pm-bar">'+bar+'</div>':'');
}
function render(){
  now=new Date();
  var today=day0(now), wt=weekType(sel), mon=mondayOf(sel), n=weeksBetween(today,sel);
  if(today.getDay()===0)n=weeksBetween(new Date(today.getTime()+864e5),sel);
  var rel=n===0?"эта неделя":n===1?"следующая неделя":n===-1?"прошлая неделя":n>1?"через "+n+" нед.":(-n)+" нед. назад";
  document.getElementById("rel").textContent=rel;
  document.getElementById("wtitle").textContent=wt==="over"?"Над чертой":"Под чертой";
  var sat=new Date(mon);sat.setDate(sat.getDate()+5);
  document.getElementById("range").textContent=mon.getMonth()===sat.getMonth()
    ? mon.getDate()+"-"+sat.getDate()+" "+MONF[mon.getMonth()]
    : mon.getDate()+" "+MON[mon.getMonth()]+" - "+sat.getDate()+" "+MON[sat.getMonth()];

  var dh="";
  for(var i=0;i<6;i++){
    var d=new Date(mon);d.setDate(d.getDate()+i);
    var c=lessonsFor(d).length;
    var dk=key(d)+"|", dn=Object.keys(notes).some(function(k){return k.indexOf(dk)===0;});
    var cls="day"+(d.getTime()===sel.getTime()?" sel":"")+(d.getTime()===today.getTime()?" is-today":"")+(dn?" has-note":"");
    dh+='<button class="'+cls+'" data-i="'+i+'" aria-label="'+DAYS[i]+', '+d.getDate()+'"><span class="dn">'+DSHORT[i]+'</span><span class="dd">'+d.getDate()+'</span><span class="cnt">'+(c?c+" п.":"·")+'</span></button>';
  }
  document.getElementById("days").innerHTML=dh;

  var list=lessonsFor(sel), isToday=sel.getTime()===today.getTime();
  var nm=now.getHours()*60+now.getMinutes();
  var st={};
  if(isToday&&list.length){
    var cur=null,nxt=null;
    list.forEach(function(l){var s=toMin(PAIRS[l.p][0]),e=toMin(PAIRS[l.p][1]);if(nm>=s&&nm<e&&!cur)cur=l;if(s>nm&&!nxt)nxt=l;});
    if(cur){st.textContent="Сейчас "+cur.p+" пара, до конца "+dur(toMin(PAIRS[cur.p][1])-nm);st.hidden=false;}
    else if(nxt){st.textContent="Следующая пара через "+dur(toMin(PAIRS[nxt.p][0])-nm)+", ауд. "+(nxt.r||"не указана");st.hidden=false;}
    else{st.textContent="Пары на сегодня закончились";st.hidden=false;}
  }

  var h="";
  if(!list.length){
    h='<div class="empty"><b>Пар нет</b>'+DAYS[(sel.getDay()+6)%7]+', '+sel.getDate()+' '+MONF[sel.getMonth()]+'</div>';
  }else{
    var prevP=null;
    list.forEach(function(l){
      if(prevP!==null&&l.p-prevP>1){
        var gs=toMin(PAIRS[prevP][1]), ge=toMin(PAIRS[l.p][0]);
        h+=gapHtml("window",gs,ge);
      }else if(prevP===2&&l.p===3){
        h+=gapHtml("big",toMin("12:25"),toMin("12:55"));
      }else if(prevP!==null){
        var ps=PAIRS[prevP][1], pe=PAIRS[l.p][0];
        h+=gapHtml("small",toMin(ps),toMin(pe));
      }
      prevP=l.p;
      var s=toMin(PAIRS[l.p][0]),e=toMin(PAIRS[l.p][1]);
      var isNow=isToday&&nm>=s&&nm<e, isPast=isToday&&nm>=e;
      var tl=l.t==="lec"?'<span class="tag t-lec">Лекция</span>':l.t==="prac"?'<span class="tag t-prac">Практика</span>':'<span class="tag t-other">Другое</span>';
      var nw="";
      if(l.from&&l.from===key(sel)){var fd=new Date(l.from+"T00:00");nw='<span class="tag t-new">с '+fd.getDate()+' '+MON[fd.getMonth()]+'</span>';}
      var prog="";
      if(isNow){
        // пара: 45 мин, перерыв 5 мин, 45 мин
        var h1=s+45, h2=s+50;
        var f1=Math.min(1,(nm-s)/45), fb=nm<h1?0:Math.min(1,(nm-h1)/5), f2=nm<h2?0:(nm-h2)/(e-h2);
        var txt=nm<h1?"До перерыва "+dur(h1-nm):nm<h2?"Перерыв 5 мин, ещё "+dur(h2-nm):"До конца пары осталось "+dur(e-nm);
        prog='<div class="bar2"><span class="seg" style="flex:45"><i style="width:'+Math.round(f1*100)+'%"></i></span>'
          +'<span class="seg brk'+(nm>=h1&&nm<h2?" on":"")+'" style="flex:5"><i style="width:'+Math.round(fb*100)+'%"></i></span>'
          +'<span class="seg" style="flex:'+(e-h2)+'"><i style="width:'+Math.round(f2*100)+'%"></i></span></div>'
          +'<div class="left">'+txt+'</div>';
      }
      var np=l.t==="prac"&&l.s!==FK, nk=key(sel)+"|"+l.p+"|"+l.s, hn=np&&!!notes[nk];
      h+='<article class="lesson'+(isNow?" now":"")+(isPast&&!hn?" past":"")+(hn?" has-note":"")+'">'
        +(np?'<button class="pen" data-k="'+esc(nk)+'" data-t="'+esc(l.s)+'" data-p="'+l.p+'" aria-label="'+(hn?"Открыть заметку":"Добавить заметку")+'">'+PEN+'</button>':'')
        +'<div class="time"><span class="pn">'+l.p+' пара</span><b>'+PAIRS[l.p][0]+'</b><span>'+PAIRS[l.p][1]+'</span></div>'
        +'<div class="body"><div class="tags">'+tl+nw+'</div>'
        +'<p class="subj">'+esc(l.s)+'</p>'
        +(l.tch?'<div class="who">'+esc(l.tch)+'</div>':'')
        +(l.r?'<div class="room"><small>ауд. </small>'+esc(l.r)+'</div>':'')
        +prog+'</div></article>';
    });
  }
  document.getElementById("list").innerHTML=h;
}

document.getElementById("days").addEventListener("click",function(e){
  var b=e.target.closest(".day");if(!b)return;
  var d=mondayOf(sel);d.setDate(d.getDate()+ +b.dataset.i);sel=d;render();
});
document.getElementById("prev").onclick=function(){sel=new Date(sel);sel.setDate(sel.getDate()-7);render();};
document.getElementById("next").onclick=function(){sel=new Date(sel);sel.setDate(sel.getDate()+7);render();};
document.getElementById("toToday").onclick=function(){sel=day0(new Date());if(sel.getDay()===0)sel.setDate(sel.getDate()+1);render();};

// Заметки: хранятся на этом телефоне, привязаны к конкретной дате и паре
var sheet=document.getElementById("sheet"), ntext=document.getElementById("ntext"), cur=null;
document.getElementById("list").addEventListener("click",function(e){
  var b=e.target.closest(".pen");if(!b)return;
  cur=b.dataset.k;
  document.getElementById("nt").textContent=b.dataset.t;
  document.getElementById("nsub").textContent=DAYS[(sel.getDay()+6)%7]+", "+sel.getDate()+" "+MONF[sel.getMonth()]+", "+b.dataset.p+" пара";
  ntext.value=notes[cur]||"";
  var d=document.getElementById("ndel");d.hidden=!notes[cur];
  sheet.hidden=false;
  if(!notes[cur])setTimeout(function(){ntext.focus();},50);
});
function closeNote(){sheet.hidden=true;cur=null;}
document.getElementById("ncancel").onclick=closeNote;
sheet.addEventListener("click",function(e){if(e.target===sheet)closeNote();});
document.getElementById("nsave").onclick=function(){
  var v=ntext.value.trim(); if(v)notes[cur]=v; else delete notes[cur];
  saveNotes();closeNote();render();
};
var cdlg=document.getElementById("cdlg");
document.getElementById("ndel").onclick=function(){cdlg.hidden=false;};
document.getElementById("cno").onclick=function(){cdlg.hidden=true;};
cdlg.addEventListener("click",function(e){if(e.target===cdlg)cdlg.hidden=true;});
document.getElementById("cyes").onclick=function(){
  cdlg.hidden=true; delete notes[cur];saveNotes();closeNote();render();
};

// Выбор недели
var wsheet=document.getElementById("wsheet"), wlist=document.getElementById("wlist");
function fmtRange(mon){var sat=new Date(mon);sat.setDate(sat.getDate()+5);
  return mon.getMonth()===sat.getMonth()?mon.getDate()+"-"+sat.getDate()+" "+MONF[mon.getMonth()]:mon.getDate()+" "+MON[mon.getMonth()]+" - "+sat.getDate()+" "+MON[sat.getMonth()];}
document.getElementById("mark").onclick=function(){
  var today=day0(new Date()), tm=mondayOf(today.getDay()===0?new Date(today.getTime()+864e5):today), sm=mondayOf(sel);
  var start=new Date(2026,7,31), end=new Date(2027,0,25), h="";
  for(var m=new Date(start);m<=end;m.setDate(m.getDate()+7)){
    var cur=m.getTime()===tm.getTime(), isSel=m.getTime()===sm.getTime();
    h+='<button class="wk'+(cur?" cur":"")+(isSel?" sel":"")+'" data-t="'+m.getTime()+'"><b>'+fmtRange(m)+'</b><span>'+(cur?"сейчас · ":"")+(weekType(m)==="over"?"над чертой":"под чертой")+'</span></button>';
  }
  wlist.innerHTML=h; wsheet.hidden=false;
  var s=wlist.querySelector(".sel");if(s)s.scrollIntoView({block:"center"});
};
wlist.addEventListener("click",function(e){
  var b=e.target.closest(".wk");if(!b)return;
  var m=new Date(+b.dataset.t), today=day0(new Date());
  sel=(mondayOf(today).getTime()===m.getTime()&&today.getDay()!==0)?today:m;
  wsheet.hidden=true;render();
});
document.getElementById("wclose").onclick=function(){wsheet.hidden=true;};
wsheet.addEventListener("click",function(e){if(e.target===wsheet)wsheet.hidden=true;});

render();
setInterval(function(){if(!document.hidden&&sheet.hidden)render();},30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)render();});
})();
</script>
