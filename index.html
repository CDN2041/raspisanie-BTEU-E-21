<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Пары Е-21</title>
<meta name="theme-color" content="#EDEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050608" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Пары">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body,button{touch-action:manipulation}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Одна колонка как приложение: экран «Сейчас» и полное расписание по неделям */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --fg:#141821; --muted:#646C7E; --line:#D7DBE4;
  --warn:#B4231B; --note:#A86A12; --note-soft:#FBF0DC;
  --font-d:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-b:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050608; --surface:#101318; --fg:#E8EBF1; --muted:#8B93A5; --line:#1F242D;
  --warn:#FF7A70; --note:#E8A94B; --note-soft:#21180A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050608; --surface:#101318; --fg:#E8EBF1; --muted:#8B93A5; --line:#1F242D;
  --warn:#FF7A70; --note:#E8A94B; --note-soft:#21180A; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
:root{--live:var(--fg); --live-soft:color-mix(in srgb,var(--fg) 26%,transparent); --past-soft:color-mix(in srgb,var(--muted) 24%,transparent)}

html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-block:18px 60px}
.view{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ico{width:20px;height:20px;display:block}

/* Верхняя строка с кнопками */
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:40px;margin-bottom:-6px}
.back{display:flex;align-items:center;gap:2px;color:var(--muted);font-weight:600;padding:6px 8px 6px 0}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--surface)}
.topbar .iconbtn{margin-left:auto}

/* Полное расписание: шапка */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--font-d);font-weight:700;font-size:28px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
.mark{flex:none;width:64px;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg)}
.mark .ico{width:26px;height:26px}
.weeknav{display:flex;align-items:center;gap:4px}
.navbtn{width:36px;height:36px;border-radius:10px;font-size:22px;line-height:1;color:var(--muted)}
.navbtn:active{background:var(--surface)}
.range{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.today{height:36px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{position:relative;border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day .dn{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.day .dd{font-family:var(--font-m);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--fg) 75%,transparent)}
.day .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.is-today .dd,.day.is-today .dn,.day.sel .dd{color:var(--fg)}
.day.sel::after{content:"";position:absolute;left:28%;right:28%;bottom:-3px;height:2px;border-radius:2px;background:var(--fg)}
.day.has-note{background:var(--note-soft)}
.day.has-note .dd,.day.has-note .dn,.day.has-note .cnt{color:var(--note)}
.day.has-note.sel::after{background:var(--note)}

/* Карточка пары */
.list{display:flex;flex-direction:column;gap:10px}
.lesson{position:relative;display:grid;grid-template-columns:62px 1fr;gap:12px;background:var(--surface);border-radius:16px;padding:14px;border:1px solid var(--line)}
.lesson.now{border-color:var(--live);box-shadow:0 0 0 1px var(--live)}
.past{opacity:.45}
.time{display:flex;flex-direction:column;font-family:var(--font-m);font-variant-numeric:tabular-nums}
.time .pn{font-size:11px;color:var(--muted);font-family:var(--font-b);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.time b{font-size:17px}
.time span{font-size:13px;color:var(--muted)}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.lesson:has(.pen) .body{padding-right:34px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px;border:1px solid transparent}
.t-lec{border-color:var(--muted)}
.t-prac{background:var(--fg);color:var(--bg)}
.t-other{border:1px dashed var(--muted);color:var(--muted)}
.t-new{background:var(--live-soft)}
.subj{font-weight:600;font-size:16px;line-height:1.3;margin:0;overflow-wrap:anywhere}
.who{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.room{font-family:var(--font-m);font-size:13px}
.room small{font-family:var(--font-b);color:var(--muted);font-size:12px}
.pen{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.has-note .pen{color:var(--note)}
.peek{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line);color:var(--note);font-size:13px;min-width:0}
.peek .ico{width:14px;height:14px;flex:none}
.peek span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.empty{text-align:center;color:var(--muted);padding:40px 12px;background:var(--surface);border-radius:16px;border:1px solid var(--line)}
.empty b{display:block;font-family:var(--font-d);font-weight:500;color:var(--fg);font-size:18px;margin-bottom:4px}

/* Шкалы */
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i,.bar2 i{display:block;height:100%;background:var(--live)}
.bar2{display:flex;gap:3px;margin-top:6px}
.bar2 .seg{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar2 .brk{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.left{font-size:12px;color:var(--live);font-weight:600}

/* Перерывы между парами */
.pm{position:relative;overflow:hidden;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;padding:6px 14px;margin-block:-3px;border-radius:10px;border:1px dashed var(--line);font-size:12px;color:var(--muted)}
.pm.on{border:1px solid var(--live);color:var(--live);font-weight:600}
.pm-l{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.pm>span:not(.fill),.big>*:not(.fill){position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--past-soft)}
.on>.fill{background:var(--live-soft)}
.big{position:relative;overflow:hidden;display:flex;gap:12px;align-items:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;padding:12px 14px}
.big.on{color:var(--live);border:1px solid var(--live)}
.big-i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--bg)}
.big-b{flex:1;min-width:0}
.big-r{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.big-r b{font-weight:600;font-size:15px}
.big-r span{font-size:13px;font-weight:600;white-space:nowrap}
.big-s{font-family:var(--font-m);font-size:12px;opacity:.8}
.gap{font-size:13px;color:var(--muted);text-align:center;padding:2px 0;display:flex;align-items:center;gap:10px}
.gap::before,.gap::after{content:"";flex:1;border-top:1px dashed var(--line)}
.gap.on{color:var(--live);font-weight:600}

/* Экран «Сейчас» */
.h-date{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.h-day{display:flex;flex-direction:column;gap:2px;min-width:0}
.h-day b{font-size:22px;font-weight:600;line-height:1.2}
.h-state{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 10px;align-self:flex-start}
.h-state i{width:8px;height:8px;border-radius:50%;background:var(--live)}
.h-tags{display:flex;gap:6px;margin-bottom:-8px}
.h-subj{font-family:var(--font-d);font-weight:700;font-size:27px;line-height:1.15;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.h-meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:15px;margin-top:-8px}
.h-meta .r{color:var(--fg)}
.h-count{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.h-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.h-big b{font-family:var(--font-m);font-weight:700;font-size:52px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.h-big span{color:var(--muted)}
.h-count .bar,.h-count .bar2 .seg{height:8px;border-radius:4px}
.h-times{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:13px;color:var(--muted)}
.h-note{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px dashed var(--note);border-radius:16px;padding:14px}
.h-note .ico{width:18px;height:18px;flex:none;color:var(--note);margin-top:2px}
.h-note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.h-note.empty-n{border-color:var(--line);color:var(--muted)}
.h-note.empty-n .ico{color:var(--muted)}
.h-sec{display:flex;flex-direction:column;gap:8px}
.h-sec h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.h-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.h-row:last-child{border-bottom:0}
.h-row .t{font-family:var(--font-m);font-size:14px;font-weight:700}
.h-row .s{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.h-row .r{font-family:var(--font-m);font-size:13px;color:var(--muted)}
.h-row .np{width:6px;height:6px;border-radius:50%;background:var(--note);display:inline-block;margin-left:6px;vertical-align:middle}
.h-done{font-family:var(--font-d);font-weight:700;font-size:27px;line-height:1.15;margin:0}
.h-all{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-weight:600}

/* Окна снизу и диалог */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.panel{background:var(--surface);width:100%;max-width:560px;max-height:85%;border-radius:20px 20px 0 0;box-sizing:border-box;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel h2{font-family:var(--font-d);font-weight:500;font-size:19px;margin:0;line-height:1.25;overflow-wrap:anywhere}
.nsub{color:var(--muted);font-size:14px;margin-top:4px}
#ntext{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;box-sizing:border-box;min-height:140px;resize:vertical}
.actions{display:flex;gap:10px}
.btn{border-radius:12px;padding:12px 14px;font-weight:600;flex:1;text-align:center}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.ghost{background:var(--bg);border:1px solid var(--line)}
.btn.del{flex:0 0 auto;color:var(--warn);border:1px solid var(--line)}
.btn.danger{background:var(--warn);color:var(--bg)}
.cal-head{display:flex;justify-content:space-between;align-items:center}
.cal-head b{font-family:var(--font-d);font-weight:500;font-size:19px}
.cal-head div{display:flex;gap:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr) 34px;row-gap:4px;text-align:center;font-family:var(--font-m);font-size:15px}
.cal-grid .h{font-family:var(--font-b);font-size:11px;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal-wk{display:contents}
.cal-grid button{height:44px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cal-grid button span{position:relative;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.cal-wk.sel>*{background:var(--bg)}
.cal-wk.sel>:first-child{border-radius:12px 0 0 12px}
.cal-wk.sel>:last-child{border-radius:0 12px 12px 0}
.cal-grid .o{color:color-mix(in srgb,var(--fg) 30%,transparent)}
.cal-grid .sun{color:var(--muted)}
.cal-grid .t span{background:var(--fg);color:var(--bg);font-weight:700}
.cal-grid .s:not(.t) span{box-shadow:inset 0 0 0 1.5px var(--fg)}
.cal-grid .n span::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--note)}
.cal-grid .g{color:var(--muted)}
.cal-grid .g .ico{width:22px;height:22px}
.cdlg{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding-inline:24px}
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:320px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px}
.cbox b{font-size:17px}
.cbox p{margin:0 0 10px;color:var(--muted);font-size:14px}

/* Настройки */
.set{display:flex;flex-direction:column;gap:8px}
.set>span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border-radius:9px;padding:10px 4px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.set small{color:var(--muted);font-size:13px}

/* Анимации */
@media (prefers-reduced-motion: no-preference){
  @keyframes inR{from{opacity:0;transform:translateX(18px)}}
  @keyframes inL{from{opacity:0;transform:translateX(-18px)}}
  @keyframes inUp{from{opacity:0;transform:translateY(12px)}}
  @keyframes fade{from{opacity:0}}
  @keyframes sheetUp{from{transform:translateY(100%)}}
  @keyframes pop{from{opacity:0;transform:scale(.94)}}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes pulse{50%{opacity:.25}}
  .enter-r>*{animation:inR .32s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
  .enter-l>*{animation:inL .32s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
  .enter-up>*{animation:inUp .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
  .sheet:not([hidden]),.cdlg:not([hidden]){animation:fade .2s ease both}
  .sheet:not([hidden]) .panel{animation:sheetUp .32s cubic-bezier(.2,.8,.2,1) both}
  .cdlg:not([hidden]) .cbox{animation:pop .22s cubic-bezier(.2,.8,.2,1) both}
  .day.sel::after{animation:grow .25s cubic-bezier(.2,.8,.2,1) both}
  .h-state.live i{animation:pulse 1.6s ease-in-out infinite}
  .bar i,.bar2 i,.fill{transition:width .8s ease}
  button{transition:transform .12s ease,background-color .15s ease}
  button:active{transform:scale(.96)}
}
</style>
</head>
<body>

<div class="app">
  <section class="view" id="home" hidden></section>

  <section class="view" id="full" hidden>
    <div class="topbar">
      <button class="back" id="toHome"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Сейчас</button>
      <button class="iconbtn" data-act="settings" aria-label="Настройки"></button>
    </div>
    <header class="top">
      <div>
        <div class="eyebrow" id="rel">эта неделя</div>
        <h1 id="wtitle">Под чертой</h1>
      </div>
      <button class="mark" id="mark" aria-label="Выбрать неделю"></button>
    </header>
    <div class="weeknav">
      <button class="navbtn" id="prev" aria-label="Предыдущая неделя">‹</button>
      <div class="range" id="range"></div>
      <button class="navbtn" id="next" aria-label="Следующая неделя">›</button>
      <button class="today" id="toToday">Сегодня</button>
    </div>
    <nav class="days" id="days"></nav>
    <section class="list" id="list"></section>
  </section>
</div>

<div class="sheet" id="wsheet" hidden>
  <div class="panel" role="dialog" aria-labelledby="wt">
    <div class="cal-head"><b id="wt">Октябрь 2026</b><div><button class="navbtn" id="cprev" aria-label="Предыдущий месяц">‹</button><button class="navbtn" id="cnext" aria-label="Следующий месяц">›</button></div></div>
    <div class="cal-grid" id="cgrid"></div>
    <div class="actions"><button class="btn ghost" id="ctoday">Сегодня</button><button class="btn ghost" data-close>Закрыть</button></div>
  </div>
</div>

<div class="sheet" id="ssheet" hidden>
  <div class="panel" role="dialog" aria-labelledby="st">
    <h2 id="st">Настройки</h2>
    <div class="set">
      <span>При открытии</span>
      <div class="seg" id="s-ui"><button data-v="new">Экран «Сейчас»</button><button data-v="old">Всё расписание</button></div>
      <small id="s-ui-h"></small>
    </div>
    <div class="set">
      <span>Тема</span>
      <div class="seg" id="s-theme"><button data-v="system">Как в системе</button><button data-v="dark">Тёмная</button><button data-v="light">Светлая</button></div>
    </div>
    <div class="actions"><button class="btn primary" data-close>Готово</button></div>
  </div>
</div>

<div class="sheet" id="nsheet" hidden>
  <div class="panel" role="dialog" aria-labelledby="nt">
    <div><h2 id="nt">Заметка</h2><div class="nsub" id="nsub"></div></div>
    <textarea id="ntext" placeholder="Например: сдать реферат, взять методичку"></textarea>
    <div class="actions">
      <button class="btn del" id="ndel">Удалить</button>
      <button class="btn ghost" data-close>Отмена</button>
      <button class="btn primary" id="nsave">Сохранить</button>
    </div>
  </div>
</div>

<div class="cdlg" id="cdlg" hidden>
  <div class="cbox" role="alertdialog" aria-labelledby="ctl">
    <b id="ctl">Удалить заметку?</b>
    <p>Восстановить её будет нельзя.</p>
    <div class="actions">
      <button class="btn ghost" id="cno">Отмена</button>
      <button class="btn danger" id="cyes">Удалить</button>
    </div>
  </div>
</div>

<script>

// ---------- Справочники ----------
var DSHORT=["Пн","Вт","Ср","Чт","Пт","Сб"];
var DAYS_FULL=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
var WHEN=["В воскресенье","В понедельник","Во вторник","В среду","В четверг","В пятницу","В субботу"];
var MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
var MONF=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
function svg(p,sw){return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';}
var I_PEN=svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>');
var I_CAL=svg('<rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>');

var I_GEAR=svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',1.8);

// ---------- Даты ----------
function $(id){return document.getElementById(id);}
function day0(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mondayOf(d){return addDays(day0(d),-((d.getDay()+6)%7));}
function weeksBetween(a,b){return Math.round((mondayOf(b)-mondayOf(a))/864e5/7);}
function weekType(d){return (((weeksBetween(ANCHOR,d)%2)+2)%2)===0?"under":"over";}
function weekName(d){return weekType(d)==="over"?"над чертой":"под чертой";}
function key(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;}
function toMin(t){var a=t.split(":");return a[0]*60+ +a[1];}
function fmtMin(x){return Math.floor(x/60)+":"+(x%60<10?"0":"")+x%60;}
function dur(m){var h=Math.floor(m/60),mm=m%60;return h?(h+" ч"+(mm?" "+mm+" мин":"")):mm+" мин";}
function nowMin(t){return t.getHours()*60+t.getMinutes();}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function studyDay(d){var x=day0(d);return x.getDay()===0?addDays(x,1):x;} // воскресенье -> понедельник
function fmtRange(mon){var sat=addDays(mon,5);
  return mon.getMonth()===sat.getMonth()?mon.getDate()+"-"+sat.getDate()+" "+MONF[mon.getMonth()]:mon.getDate()+" "+MON[mon.getMonth()]+" - "+sat.getDate()+" "+MON[sat.getMonth()];}
function span(l){return [toMin(PAIRS[l.p][0]),toMin(PAIRS[l.p][1])];}

function lessonsFor(d){
  var wd=(d.getDay()+6)%7; if(wd>5)return [];
  var wt=weekType(d), k=key(d);
  return LESSONS.filter(function(l){return l.d===wd&&(l.w==="all"||l.w===wt)&&(!l.from||k>=l.from);})
    .sort(function(a,b){return a.p-b.p;});
}

// ---------- Хранилище ----------
function load(k,def){try{var v=JSON.parse(localStorage.getItem(k));return v&&typeof v==="object"?v:def;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var NKEY="pary-notes-v1", SKEY="pary-settings-v1";
var notes=load(NKEY,{});
var settings=load(SKEY,{}); if(settings.ui!=="old")settings.ui="new"; if(["dark","light"].indexOf(settings.theme)<0)settings.theme="system";

// Заметки только у практик, кроме физкультуры
function canNote(l){return l.t==="prac"&&l.s!==FK;}
function noteKey(d,l){return key(d)+"|"+l.p+"|"+l.s;}
function noteOf(d,l){return canNote(l)?notes[noteKey(d,l)]:undefined;}
function dayHasNote(d){var p=key(d)+"|";for(var k in notes)if(k.indexOf(p)===0)return true;return false;}

// ---------- Общие куски разметки ----------
function tagHtml(l){return l.t==="lec"?'<span class="tag t-lec">Лекция</span>':l.t==="prac"?'<span class="tag t-prac">Практика</span>':'<span class="tag t-other">Другое</span>';}
function pairBar(s,e,m){ // 45 мин, перерыв 5 мин, 45 мин
  var h1=s+45,h2=s+50, f1=Math.min(1,(m-s)/45), fb=m<h1?0:Math.min(1,(m-h1)/5), f2=m<h2?0:(m-h2)/(e-h2);
  var pc=function(f){return Math.round(Math.max(0,f)*100)+"%";};
  return {h1:h1,h2:h2,html:'<div class="bar2"><span class="seg" style="flex:45"><i style="width:'+pc(f1)+'"></i></span><span class="seg brk" style="flex:5"><i style="width:'+pc(fb)+'"></i></span><span class="seg" style="flex:'+(e-h2)+'"><i style="width:'+pc(f2)+'"></i></span></div>'};
}
function noteAttrs(d,l){return ' data-k="'+esc(noteKey(d,l))+'" data-t="'+esc(l.s)+'" data-p="'+l.p+'" data-d="'+d.getTime()+'"';}
function stagger(el,cls){
  el.classList.remove("enter-l","enter-r","enter-up");
  if(!cls)return; void el.offsetWidth; el.classList.add(cls);
  Array.prototype.forEach.call(el.children,function(c,i){c.style.setProperty("--i",Math.min(i,8));});
}

// ---------- Полное расписание ----------
var sel=studyDay(new Date()), lastSel=null;

function gapHtml(kind,gs,ge,ref){
  var t=new Date(), m=nowMin(t), td=day0(t).getTime(), sd=sel.getTime();
  var on=sd===td&&m>=gs&&m<ge, past=sd<td||(sd===td&&m>=ge);
  var fill=sd<td?100:sd>td?0:Math.max(0,Math.min(100,(m-gs)/(ge-gs)*100));
  var cls=(on?" on":"")+(past?" past":""), f='<span class="fill" style="width:'+fill.toFixed(1)+'%"></span>';
  if(kind==="small")return '<div class="pm'+cls+'">'+f+'<span class="pm-l">'+dur(ge-gs)+'</span><span>'+(on?"Перерыв, ещё "+dur(ge-m):"Перерыв")+'</span></div>';
  if(kind==="big")return '<div class="big'+cls+'">'+f+'<span class="big-i">'+I_CUP+'</span><div class="big-b"><div class="big-r"><b>Большой перерыв</b><span>'+(on?"ещё "+dur(ge-m):dur(ge-gs))+'</span></div><div class="big-s">'+fmtMin(gs)+' - '+fmtMin(ge)+'</div></div></div>';
  return '<div class="gap'+cls+'"><span>Окно '+dur(ge-gs)+(on?", ещё "+dur(ge-m):"")+'</span></div>';
}

function lessonCard(l,isToday,m){
  var se=span(l), s=se[0], e=se[1], isNow=isToday&&m>=s&&m<e, isPast=isToday&&m>=e;
  var nt=noteOf(sel,l), hn=!!nt, nw="", prog="";
  if(l.from&&l.from===key(sel)){var fd=new Date(l.from+"T00:00");nw='<span class="tag t-new">с '+fd.getDate()+' '+MON[fd.getMonth()]+'</span>';}
  if(isNow){
    var b=pairBar(s,e,m);
    prog=b.html+'<div class="left">'+(m<b.h1?"До перерыва "+dur(b.h1-m):m<b.h2?"До конца перерыва "+dur(b.h2-m):"До конца пары осталось "+dur(e-m))+'</div>';
  }
  return '<article class="lesson'+(isNow?" now":"")+(isPast&&!hn?" past":"")+(hn?" has-note":"")+'">'
    +(canNote(l)?'<button class="pen"'+noteAttrs(sel,l)+' aria-label="'+(hn?"Открыть заметку":"Добавить заметку")+'">'+I_PEN+'</button>':'')
    +'<div class="time"><span class="pn">'+l.p+' пара</span><b>'+PAIRS[l.p][0]+'</b><span>'+PAIRS[l.p][1]+'</span></div>'
    +'<div class="body"><div class="tags">'+tagHtml(l)+nw+'</div>'
    +'<p class="subj">'+esc(l.s)+'</p>'
    +(l.tch?'<div class="who">'+esc(l.tch)+'</div>':'')
    +(l.r?'<div class="room"><small>ауд. </small>'+esc(l.r)+'</div>':'')
    +prog+(hn?'<div class="peek">'+I_PEN+'<span>'+esc(nt.split("\n")[0])+'</span></div>':'')+'</div></article>';
}

function renderFull(){
  var t=new Date(), today=day0(t), m=nowMin(t), mon=mondayOf(sel), n=weeksBetween(studyDay(t),sel);
  $("rel").textContent=n===0?"эта неделя":n===1?"следующая неделя":n===-1?"прошлая неделя":n>1?"через "+n+" нед.":(-n)+" нед. назад";
  $("wtitle").textContent=weekType(sel)==="over"?"Над чертой":"Под чертой";
  $("range").textContent=fmtRange(mon);

  var dh="";
  for(var i=0;i<6;i++){
    var d=addDays(mon,i), c=lessonsFor(d).length;
    dh+='<button class="day'+(d.getTime()===sel.getTime()?" sel":"")+(d.getTime()===today.getTime()?" is-today":"")+(dayHasNote(d)?" has-note":"")
      +'" data-i="'+i+'" aria-label="'+DAYS_FULL[d.getDay()]+', '+d.getDate()+'"><span class="dn">'+DSHORT[i]+'</span><span class="dd">'+d.getDate()+'</span><span class="cnt">'+(c?c+" п.":"·")+'</span></button>';
  }
  $("days").innerHTML=dh;

  var list=lessonsFor(sel), isToday=sel.getTime()===today.getTime(), h="";
  if(!list.length){
    h='<div class="empty"><b>Пар нет</b>'+DAYS_FULL[sel.getDay()]+', '+sel.getDate()+' '+MONF[sel.getMonth()]+'</div>';
  }else{
    list.forEach(function(l,i){
      var p=i?list[i-1]:null;
      if(p){
        if(l.p-p.p>1)h+=gapHtml("window",span(p)[1],span(l)[0]);
        else if(p.p===2&&l.p===3)h+=gapHtml("big",toMin(BIG[0]),toMin(BIG[1]));
        else h+=gapHtml("small",span(p)[1],span(l)[0]);
      }
      h+=lessonCard(l,isToday,m);
    });
  }
  var el=$("list"), sk=sel.getTime();
  el.innerHTML=h;
  stagger(el,lastSel===null?"enter-up":sk!==lastSel?(sk>lastSel?"enter-r":"enter-l"):null);
  lastSel=sk;
}

// ---------- Экран «Сейчас» ----------
function lessonHead(l){
  return '<div class="h-tags">'+tagHtml(l)+'</div><p class="h-subj">'+esc(l.s)+'</p>'
    +'<div class="h-meta">'+(l.tch?'<span>'+esc(l.tch)+'</span>':'')+(l.r?'<span class="r">ауд. '+esc(l.r)+'</span>':'')+'</div>';
}
function noteBlock(l,d){
  if(!canNote(l))return "";
  var txt=noteOf(d,l);
  return '<button class="h-note'+(txt?"":" empty-n")+'"'+noteAttrs(d,l)+'>'+I_PEN+'<p>'+(txt?esc(txt):"Добавить заметку")+'</p></button>';
}
function rows(arr,d){
  return '<div>'+arr.map(function(l){
    return '<div class="h-row"><span class="t">'+PAIRS[l.p][0]+'</span><span class="s">'+esc(l.s)+(noteOf(d,l)?'<i class="np"></i>':'')+'</span><span class="r">'+esc(l.r)+'</span></div>';
  }).join("")+'</div>';
}
function sec(title,inner){return '<div class="h-sec"><h3>'+title+'</h3>'+(inner||"")+'</div>';}

function renderHome(anim){
  var t=new Date(), td=day0(t), m=nowMin(t), list=lessonsFor(td);
  var h='<div class="h-date"><div class="h-day"><span class="eyebrow">Сегодня · '+(td.getDay()===0?"с завтра ":"")+weekName(studyDay(t))+'</span><b>'+DAYS_FULL[td.getDay()]+', '+td.getDate()+' '+MONF[td.getMonth()]+'</b></div>'
    +'<button class="iconbtn" data-act="settings" aria-label="Настройки">'+I_GEAR+'</button></div>';
  var cur=null,next=null,prev=null;
  list.forEach(function(l){var se=span(l);
    if(m>=se[0]&&m<se[1])cur=l; else if(se[0]>m){if(!next)next=l;} else prev=l;});

  if(cur){
    var se=span(cur), b=pairBar(se[0],se[1],m);
    var big=m<b.h1?[b.h1-m,"до перерыва"]:m<b.h2?[b.h2-m,"до конца перерыва"]:[se[1]-m,"до конца пары"];
    h+='<div class="h-state live"><i></i>Идёт '+cur.p+' пара</div>'+lessonHead(cur)
      +'<div class="h-count"><div class="h-big"><b>'+dur(big[0])+'</b><span>'+big[1]+'</span></div>'+b.html
      +'<div class="h-times"><span>'+PAIRS[cur.p][0]+'</span><span>'+PAIRS[cur.p][1]+'</span></div></div>'
      +noteBlock(cur,td);
    var rest=list.filter(function(l){return l.p>cur.p;});
    if(rest.length)h+=sec("Дальше сегодня",rows(rest,td));
  }else if(next){
    var ns=span(next)[0], from=prev?span(prev)[1]:null;
    var label=!prev?"До первой пары":(prev.p===2&&next.p===3)?"Большой перерыв":next.p-prev.p>1?"Окно":"Перерыв";
    var pc=from!==null?Math.max(0,Math.min(100,(m-from)/(ns-from)*100)):0;
    h+='<div class="h-state"><i></i>'+label+'</div>'
      +'<div class="h-count"><div class="h-big"><b>'+dur(ns-m)+'</b><span>до '+next.p+' пары</span></div>'
      +(from!==null?'<div class="bar"><i style="width:'+pc.toFixed(1)+'%"></i></div><div class="h-times"><span>'+fmtMin(from)+'</span><span>'+PAIRS[next.p][0]+'</span></div>':'')+'</div>'
      +sec("Следующая")+lessonHead(next)+noteBlock(next,td);
    var rest2=list.filter(function(l){return l.p>next.p;});
    if(rest2.length)h+=sec("Потом",rows(rest2,td));
  }else{
    var nd=null,nl=[];
    for(var i=1;i<=14&&!nd;i++){var d=addDays(td,i),ll=lessonsFor(d);if(ll.length){nd=d;nl=ll;}}
    h+='<p class="h-done">'+(list.length?"Пары на сегодня закончились":"Сегодня пар нет")+'</p>';
    if(nd){
      var dd=Math.round((nd-td)/864e5);
      var lbl=dd===1?"Завтра":dd===2?"Послезавтра":WHEN[nd.getDay()]+", "+nd.getDate()+" "+MONF[nd.getMonth()];
      var more=dd===1?"Ещё завтра":dd===2?"Ещё послезавтра":"Ещё "+WHEN[nd.getDay()].toLowerCase();
      h+=sec(lbl+", первая в "+PAIRS[nl[0].p][0])+lessonHead(nl[0])+noteBlock(nl[0],nd);
      if(nl.length>1)h+=sec(more,rows(nl.slice(1),nd));
    }
  }
  h+='<button class="h-all" data-act="all">'+I_CAL+'Всё расписание</button>';
  var el=$("home"); el.innerHTML=h;
  stagger(el,anim?"enter-up":null);
}

// ---------- Переключение экранов ----------
var view=null;
function show(v){
  view=v;
  $("home").hidden=v!=="home"; $("full").hidden=v!=="full";
  $("toHome").hidden=settings.ui==="old";
  if(v==="home")renderHome(true);
  else{lastSel=null;renderFull();}
  window.scrollTo(0,0);
}
function refresh(){if(view==="home")renderHome(false);else renderFull();}

// ---------- Окна ----------
function openSheet(id){$(id).hidden=false;}
function closeSheet(id){$(id).hidden=true;}
Array.prototype.forEach.call(document.querySelectorAll(".sheet"),function(sh){
  sh.addEventListener("click",function(e){if(e.target===sh||e.target.closest("[data-close]"))closeSheet(sh.id);});
});

// Заметки
var curNote=null, cdlg=$("cdlg"), ntext=$("ntext");
function openNote(b){
  var nd=new Date(+b.dataset.d);
  curNote=b.dataset.k;
  $("nt").textContent=b.dataset.t;
  $("nsub").textContent=DAYS_FULL[nd.getDay()]+", "+nd.getDate()+" "+MONF[nd.getMonth()]+", "+b.dataset.p+" пара";
  ntext.value=notes[curNote]||"";
  $("ndel").hidden=!notes[curNote];
  openSheet("nsheet");
  if(!notes[curNote])setTimeout(function(){ntext.focus();},50);
}
function doneNote(){save(NKEY,notes);closeSheet("nsheet");curNote=null;refresh();}
$("nsave").onclick=function(){var v=ntext.value.trim();if(v)notes[curNote]=v;else delete notes[curNote];doneNote();};
$("ndel").onclick=function(){cdlg.hidden=false;};
$("cno").onclick=function(){cdlg.hidden=true;};
cdlg.addEventListener("click",function(e){if(e.target===cdlg)cdlg.hidden=true;});
$("cyes").onclick=function(){cdlg.hidden=true;delete notes[curNote];doneNote();};

// Выбор недели: календарь месяца
var MONN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var cMonth=null;
function glyph(t){return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="'+(t==="over"?6:18)+'" r="3.2" fill="currentColor"/></svg>';}
function renderCal(){
  var today=day0(new Date()), first=new Date(cMonth.getFullYear(),cMonth.getMonth(),1), m=mondayOf(first), sm=mondayOf(sel).getTime();
  $("wt").textContent=MONN[first.getMonth()]+" "+first.getFullYear();
  var h=["Пн","Вт","Ср","Чт","Пт","Сб","Вс",""].map(function(x){return '<div class="h">'+x+'</div>';}).join("");
  while(m.getMonth()===first.getMonth()||m<first){
    h+='<div class="cal-wk'+(m.getTime()===sm?" sel":"")+'">';
    for(var i=0;i<7;i++){
      var d=addDays(m,i), c=(d.getMonth()!==first.getMonth()?"o ":"")+(i===6?"sun ":"")+(d.getTime()===today.getTime()?"t ":"")+(d.getTime()===sel.getTime()?"s ":"")+(dayHasNote(d)?"n":"");
      h+='<button class="'+c+'" data-t="'+d.getTime()+'" aria-label="'+d.getDate()+' '+MONF[d.getMonth()]+'"><span>'+d.getDate()+'</span></button>';
    }
    h+='<button class="g" data-w="'+m.getTime()+'" aria-label="Неделя '+weekName(m)+'">'+glyph(weekType(m))+'</button></div>';
    m=addDays(m,7);
  }
  $("cgrid").innerHTML=h;
}
function pick(d){sel=d;closeSheet("wsheet");renderFull();}
$("mark").innerHTML=I_CAL;
$("mark").onclick=function(){cMonth=new Date(sel.getFullYear(),sel.getMonth(),1);renderCal();openSheet("wsheet");};
$("cprev").onclick=function(){cMonth=new Date(cMonth.getFullYear(),cMonth.getMonth()-1,1);renderCal();};
$("cnext").onclick=function(){cMonth=new Date(cMonth.getFullYear(),cMonth.getMonth()+1,1);renderCal();};
$("ctoday").onclick=function(){pick(studyDay(new Date()));};
$("cgrid").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return;
  if(b.dataset.w){var wm=new Date(+b.dataset.w), sd=studyDay(new Date());pick(mondayOf(sd).getTime()===wm.getTime()?sd:wm);return;}
  var d=new Date(+b.dataset.t); pick(d.getDay()===0?addDays(d,1):d);
});

// Настройки
var hostTheme=document.documentElement.getAttribute("data-theme");
function applyTheme(){
  var r=document.documentElement;
  if(settings.theme==="system"){if(hostTheme)r.setAttribute("data-theme",hostTheme);else r.removeAttribute("data-theme");}
  else r.setAttribute("data-theme",settings.theme);
  var bg=getComputedStyle(document.body).backgroundColor;
  Array.prototype.forEach.call(document.querySelectorAll('meta[name="theme-color"]'),function(mt){mt.removeAttribute("media");mt.setAttribute("content",bg);});
}
function paintSettings(){
  [["s-ui",settings.ui],["s-theme",settings.theme]].forEach(function(p){
    Array.prototype.forEach.call($(p[0]).children,function(b){b.setAttribute("aria-pressed",b.dataset.v===p[1]?"true":"false");});
  });
  $("s-ui-h").textContent=settings.ui==="new"?"Сначала текущая пара и сколько до конца, полное расписание по кнопке.":"Сразу открывается полное расписание недели, как раньше.";
}
$("s-ui").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  settings.ui=b.dataset.v; save(SKEY,settings); paintSettings(); $("toHome").hidden=settings.ui==="old";
  if(settings.ui==="old"&&view==="home")show("full");});
$("s-theme").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  settings.theme=b.dataset.v; save(SKEY,settings); paintSettings(); applyTheme();});

// Кнопки на экранах
Array.prototype.forEach.call(document.querySelectorAll('[data-act="settings"]'),function(b){b.innerHTML=I_GEAR;});
document.addEventListener("click",function(e){
  var a=e.target.closest("[data-act]");
  if(a){
    if(a.dataset.act==="settings"){paintSettings();openSheet("ssheet");}
    else if(a.dataset.act==="all"){sel=studyDay(new Date());show("full");}
    return;
  }
  var n=e.target.closest(".pen,.h-note"); if(n)openNote(n);
});
$("toHome").onclick=function(){show("home");};
$("days").addEventListener("click",function(e){
  var b=e.target.closest(".day"); if(!b)return;
  sel=addDays(mondayOf(sel),+b.dataset.i); renderFull();
});
$("prev").onclick=function(){sel=addDays(sel,-7);renderFull();};
$("next").onclick=function(){sel=addDays(sel,7);renderFull();};
$("toToday").onclick=function(){sel=studyDay(new Date());renderFull();};

// Старт и автообновление
applyTheme();
show(settings.ui==="old"?"full":"home");
function quiet(){return document.querySelectorAll(".sheet:not([hidden])").length===0;}
setInterval(function(){if(!document.hidden&&quiet())refresh();},30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&quiet())refresh();});
})();
</script>
<script>
["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},{passive:false});});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
