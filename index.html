<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Пары Е-21</title>
<meta name="theme-color" content="#EDEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050608" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Пары">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body,button{touch-action:manipulation}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Одна колонка как приложение: экран «Сейчас» и полное расписание по неделям */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --fg:#141821; --muted:#646C7E; --line:#D7DBE4;
  --warn:#B4231B; --note:#A86A12; --note-soft:#FBF0DC;
  --font-d:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-b:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050608; --surface:#101318; --fg:#E8EBF1; --muted:#8B93A5; --line:#1F242D;
  --warn:#FF7A70; --note:#E8A94B; --note-soft:#21180A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050608; --surface:#101318; --fg:#E8EBF1; --muted:#8B93A5; --line:#1F242D;
  --warn:#FF7A70; --note:#E8A94B; --note-soft:#21180A; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
:root{--live:var(--fg);--live-soft:color-mix(in srgb,var(--fg) 26%,transparent);--past-soft:color-mix(in srgb,var(--muted) 24%,transparent);--ios:cubic-bezier(.32,.72,0,1)}

html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-block:18px 24px;display:flex;flex-direction:column;min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));box-sizing:border-box}
.view{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ico{width:20px;height:20px;display:block}

/* Верхняя строка с кнопками */
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:40px;margin-bottom:-6px}
.back{display:flex;align-items:center;gap:2px;color:var(--muted);font-weight:600;padding:6px 8px 6px 0}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--surface)}
.topbar .iconbtn{margin-left:auto}

/* Полное расписание: шапка */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--font-d);font-weight:700;font-size:28px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
.mark{flex:none;width:64px;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg)}
.mark .ico{width:26px;height:26px}
.weeknav{display:flex;align-items:center;gap:4px}
.navbtn{width:36px;height:36px;border-radius:10px;font-size:22px;line-height:1;color:var(--muted)}
.navbtn:active{background:var(--surface)}
.navbtn:disabled{opacity:.25;cursor:default;background:none}
.range{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.today{height:36px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day.off{opacity:.25}
.day{position:relative;border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day .dn{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.day .dd{font-family:var(--font-m);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--fg) 75%,transparent)}
.day .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.is-today .dd,.day.is-today .dn,.day.sel .dd{color:var(--fg)}
.day.sel{box-shadow:inset 0 0 0 1.5px var(--fg)}
.day.has-note{background:var(--note-soft)}
.day.has-note .dd,.day.has-note .dn,.day.has-note .cnt{color:var(--note)}
.day.has-note.sel{box-shadow:inset 0 0 0 1.5px var(--note)}

/* Карточка пары */
.list{display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.lesson{position:relative;display:grid;grid-template-columns:62px 1fr;gap:12px;background:var(--surface);border-radius:16px;padding:14px;border:1px solid var(--line)}
.lesson.now{border-color:var(--live);box-shadow:0 0 0 1px var(--live)}
.past{opacity:.45}
.time{display:flex;flex-direction:column;font-family:var(--font-m);font-variant-numeric:tabular-nums}
.time .pn{font-size:11px;color:var(--muted);font-family:var(--font-b);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.time b{font-size:17px}
.time span{font-size:13px;color:var(--muted)}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.lesson:has(.pen) .body{padding-right:34px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px;border:1px solid transparent}
.t-lec{border-color:var(--muted)}
.t-prac{background:var(--fg);color:var(--bg)}
.t-mix{border-color:var(--fg)}
.t-new{background:var(--live-soft)}
.t-sub{border:1px dashed var(--fg)}
.t-cancel{border-color:var(--muted);color:var(--muted)}
.t-k-exam{background:var(--fg);color:var(--bg)}
.t-k-credit{border-color:var(--fg)}
.t-k-consult,.t-k-other{border-color:var(--muted)}
.lesson.cancel{opacity:.55}
.lesson.cancel .subj{text-decoration:line-through}
.h-was{font-size:13px;color:var(--muted);margin-top:-8px}
.h-row.cancel .s{text-decoration:line-through;color:var(--muted)}
.was{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.subj{font-weight:600;font-size:16px;line-height:1.3;margin:0;overflow-wrap:anywhere}
.who{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.room{font-family:var(--font-m);font-size:13px}
.room small{font-family:var(--font-b);color:var(--muted);font-size:12px}
.pen{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.has-note .pen{color:var(--note)}
.peek{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line);color:var(--note);font-size:13px;min-width:0}
.peek .ico{width:14px;height:14px;flex:none}
.peek span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.empty{text-align:center;color:var(--muted);padding:40px 12px;background:var(--surface);border-radius:16px;border:1px solid var(--line)}
.empty b{display:block;font-family:var(--font-d);font-weight:500;color:var(--fg);font-size:18px;margin-bottom:4px}

/* Шкалы */
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i,.bar2 i{display:block;height:100%;background:var(--live)}
.bar2{display:flex;gap:3px;margin-top:6px}
.bar2 .seg{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar2 .brk{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.left{font-size:12px;color:var(--live);font-weight:600}

/* Перерывы между парами */
.pm{position:relative;overflow:hidden;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;padding:6px 14px;margin-block:-3px;border-radius:10px;border:1px dashed var(--line);font-size:12px;color:var(--muted)}
.pm.on{border:1px solid var(--live);color:var(--live);font-weight:600}
.pm-l{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.pm>span:not(.fill),.big>*:not(.fill){position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--past-soft)}
.on>.fill{background:var(--live-soft)}
.big{position:relative;overflow:hidden;display:flex;gap:12px;align-items:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;padding:12px 14px}
.big.on{color:var(--live);border:1px solid var(--live)}
.big-i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--bg)}
.big-b{flex:1;min-width:0}
.big-r{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.big-r b{font-weight:600;font-size:15px}
.big-r span{font-size:13px;font-weight:600;white-space:nowrap}
.big-s{font-family:var(--font-m);font-size:12px;opacity:.8}
.gap{font-size:13px;color:var(--muted);text-align:center;padding:2px 0;display:flex;align-items:center;gap:10px}
.gap::before,.gap::after{content:"";flex:1;border-top:1px dashed var(--line)}
.gap.on{color:var(--live);font-weight:600}

/* Экран «Сейчас» */
.h-date{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.h-day{display:flex;flex-direction:column;gap:2px;min-width:0}
.h-day b{font-size:22px;font-weight:600;line-height:1.2}
.h-state{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 10px;align-self:flex-start}
.h-state i{width:8px;height:8px;border-radius:50%;background:var(--live)}
.h-tags{display:flex;gap:6px;margin-bottom:-8px}
.h-subj{font-family:var(--font-d);font-weight:700;font-size:27px;line-height:1.15;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.h-meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:15px;margin-top:-8px}
.h-meta .r{color:var(--fg)}
.h-count{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.h-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.h-big b{font-family:var(--font-m);font-weight:700;font-size:52px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.h-big span{color:var(--muted)}
.h-count .bar,.h-count .bar2 .seg{height:8px;border-radius:4px}
.h-times{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:13px;color:var(--muted)}
.h-note{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px dashed var(--note);border-radius:16px;padding:14px}
.h-note .ico{width:18px;height:18px;flex:none;color:var(--note);margin-top:2px}
.h-note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.h-note.empty-n{border-color:var(--line);color:var(--muted)}
.h-note.empty-n .ico{color:var(--muted)}
.h-sec{display:flex;flex-direction:column;gap:8px}
.h-sec h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.h-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.h-row:last-child{border-bottom:0}
.h-row .t{font-family:var(--font-m);font-size:14px;font-weight:700}
.h-row .s{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.h-row .r{font-family:var(--font-m);font-size:13px;color:var(--muted)}
.h-row .np{width:6px;height:6px;border-radius:50%;background:var(--note);display:inline-block;margin-left:6px;vertical-align:middle}
.h-done{font-family:var(--font-d);font-weight:700;font-size:27px;line-height:1.15;margin:0}
.h-cancel{display:flex;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:14px;padding:10px 14px;color:var(--muted);font-size:14px;min-width:0}
.h-cancel .ico{width:16px;height:16px;flex:none}
.h-cancel span{min-width:0;overflow-wrap:anywhere}
.h-all{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-weight:600}

.ver{margin-top:auto;padding-top:24px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* Окна снизу и диалог */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.panel{touch-action:none;background:var(--surface);width:100%;max-width:560px;max-height:85%;border-radius:20px 20px 0 0;box-sizing:border-box;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel::before{content:"";flex:none;width:36px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin:-8px 0 0}
.panel textarea{touch-action:auto}
.panel h2{font-family:var(--font-d);font-weight:500;font-size:19px;margin:0;line-height:1.25;overflow-wrap:anywhere}
.nsub{color:var(--muted);font-size:14px;margin-top:4px}
#ntext{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;box-sizing:border-box;min-height:140px;resize:vertical}
.actions{display:flex;gap:10px}
.btn{border-radius:12px;padding:12px 14px;font-weight:600;flex:1;text-align:center;text-decoration:none;color:inherit;display:block}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.ghost{background:var(--bg);border:1px solid var(--line)}
.btn.del{flex:0 0 auto;color:var(--warn);border:1px solid var(--line)}
.btn.danger{background:var(--warn);color:var(--bg)}
.cal-head{display:flex;justify-content:space-between;align-items:center}
.cal-head b{font-family:var(--font-d);font-weight:500;font-size:19px}
.cal-head div{display:flex;gap:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr) 34px;row-gap:4px;text-align:center;font-family:var(--font-m);font-size:15px}
.cal-grid .h{font-family:var(--font-b);font-size:11px;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal-wk{display:contents}
.cal-grid button{height:44px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cal-grid button span{position:relative;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.cal-wk.sel>*{background:var(--bg)}
.cal-wk.sel>:first-child{border-radius:12px 0 0 12px}
.cal-wk.sel>:last-child{border-radius:0 12px 12px 0}
.cal-grid .o{color:color-mix(in srgb,var(--fg) 30%,transparent)}
.cal-grid .sun{color:var(--muted)}
.cal-grid .t span{background:var(--fg);color:var(--bg);font-weight:700}
.cal-grid .s:not(.t) span{box-shadow:inset 0 0 0 1.5px var(--fg)}
.cal-grid .x:not(.s):not(.t) span{box-shadow:inset 0 0 0 1.5px var(--muted)}
.cal-grid .off{opacity:.2;pointer-events:none}
.cal-grid .n span::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--note)}
.cal-grid .g{color:var(--muted)}
.cal-grid .g .ico{width:22px;height:22px}
.cdlg{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding-inline:24px}
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:320px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px}
.cbox b{font-size:17px}
.cbox p{margin:0 0 10px;color:var(--muted);font-size:14px}

/* Настройки */
.set{display:flex;flex-direction:column;gap:8px}
.set>span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border-radius:9px;padding:10px 4px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}

.adm-err{color:var(--warn);font-size:14px;border:1px solid var(--warn);border-radius:12px;padding:10px 12px}
a.btn[aria-busy="true"]{opacity:.6;pointer-events:none}

/* Анимации: мягкая кривая как в iOS */
@media (prefers-reduced-motion: no-preference){
  @keyframes inR{from{opacity:0;transform:translateX(24px)}}
  @keyframes inL{from{opacity:0;transform:translateX(-24px)}}
  @keyframes inUp{from{opacity:0;transform:translateY(10px)}}
  @keyframes fade{from{opacity:0}}
  @keyframes fadeOut{to{opacity:0}}
  @keyframes sheetUp{from{transform:translateY(100%)}}
  @keyframes sheetDown{to{transform:translateY(100%)}}
  @keyframes pop{from{opacity:0;transform:scale(1.08)}}
  @keyframes popOut{to{opacity:0;transform:scale(.96)}}
  @keyframes pulse{50%{opacity:.25}}
  .enter-r>*{animation:inR .5s var(--ios) both;animation-delay:calc(var(--i,0)*28ms)}
  .enter-l>*{animation:inL .5s var(--ios) both;animation-delay:calc(var(--i,0)*28ms)}
  .enter-up>*{animation:inUp .55s var(--ios) both;animation-delay:calc(var(--i,0)*40ms)}
  .cal-grid.slide-r{animation:inR .45s var(--ios) both}
  .cal-grid.slide-l{animation:inL .45s var(--ios) both}
  @keyframes rowIn{from{background:transparent}}
  @keyframes dayIn{from{transform:scale(.6);opacity:0}}
  .cal-grid.flash .cal-wk.sel>*{animation:rowIn .5s var(--ios) both}
  .cal-grid.flash .t span{animation:dayIn .5s var(--ios) both}
  .sheet:not([hidden]),.cdlg:not([hidden]){animation:fade .35s ease both}
  .sheet:not([hidden]) .panel{animation:sheetUp .5s var(--ios) both}
  .cdlg:not([hidden]) .cbox{animation:pop .35s var(--ios) both}
  .sheet.closing{animation:fadeOut .3s ease both}
  .sheet.closing .panel{animation:sheetDown .3s var(--ios) both}
  .cdlg.closing{animation:fadeOut .25s ease both}
  .cdlg.closing .cbox{animation:popOut .25s ease both}
  .h-state.live i{animation:pulse 1.6s ease-in-out 3}
  .bar i,.bar2 i,.fill{transition:width 1s var(--ios)}
  .day{transition:box-shadow .3s var(--ios),background-color .3s var(--ios)}
  button{transition:transform .3s var(--ios),background-color .2s ease,opacity .2s ease}
  button:active{transform:scale(.97);transition-duration:.08s}
}
</style>
</head>
<body>
<div class="app">
  <section class="view" id="home" hidden></section>

  <section class="view" id="full" hidden>
    <div class="topbar">
      <button class="back" id="toHome"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Сейчас</button>
      <button class="iconbtn" data-act="settings" aria-label="Настройки"></button>
    </div>
    <header class="top">
      <div>
        <div class="eyebrow" id="rel">эта неделя</div>
        <h1 id="wtitle">Под чертой</h1>
      </div>
      <button class="mark" id="mark" aria-label="Выбрать неделю"></button>
    </header>
    <div class="weeknav">
      <button class="navbtn" id="prev" aria-label="Предыдущая неделя">‹</button>
      <div class="range" id="range"></div>

<script>
(function(){
"use strict";
// ---------- Откуда берём расписание ----------
// Всё расписание (звонки, пары, замены, отмены, сессия) лежит в schedule.json, его правит admin.html.
// Последняя загруженная версия хранится в браузере: приложение открывается сразу и работает без сети.
var SCHED_URL="schedule.json", CACHE_KEY="pary-e21-schedule-v1", DRAFT_KEY="pary-e21-draft-v1", TOKEN_KEY="pary-e21-admin-token";
var DEMO=!/\.github\.io$/.test(location.hostname); // в демо админка сохраняет черновик только в браузере
var FK="Физическая культура";
var KINDS={exam:"Экзамен",credit:"Зачёт",consult:"Консультация",other:"Событие"};
var KGEN={exam:"экзамена",credit:"зачёта",consult:"консультации",other:"события"};
var KSHORT={exam:"экз.",credit:"зач.",consult:"конс.",other:"соб."};

// Заполняются из schedule.json в prepare()
var ANCHOR,ANCHOR_T,LAST,END_ALL,PAIRS,BYDAY,CHANGES,P2=false,SESSION,LASTM,FIRST,FIRSTM;
var P2KEY="pary-e21-p2"; // режим «телефон 2»: свои правки поверх общего расписания

// ---------- Справочники ----------
var DSHORT=["Пн","Вт","Ср","Чт","Пт","Сб"];
var DAYS_FULL=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
var WHEN=["В воскресенье","В понедельник","Во вторник","В среду","В четверг","В пятницу","В субботу"];
var MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
var MONF=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
function svg(p,sw){return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';}
var I_PEN=svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>');
var I_CAL=svg('<rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>');
var I_CUP=svg('<path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5Z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3v3M12 3v3"/>');
var I_GEAR=svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',1.8);

// ---------- Даты ----------
function $(id){return document.getElementById(id);}
function day0(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mondayOf(d){return addDays(day0(d),-((d.getDay()+6)%7));}
function weeksBetween(a,b){return Math.round((mondayOf(b)-mondayOf(a))/864e5/7);}
function weekType(d){var even=(((weeksBetween(ANCHOR,d)%2)+2)%2)===0;return even?ANCHOR_T:(ANCHOR_T==="under"?"over":"under");}
function weekName(d){return weekType(d)==="over"?"над чертой":"под чертой";}
function key(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;}
function pd(s){var a=String(s).split("-");return new Date(+a[0],a[1]-1,+a[2]);}
function toMin(t){var a=String(t).split(":");return a[0]*60+ +a[1];}
function fmtMin(x){return Math.floor(x/60)+":"+(x%60<10?"0":"")+x%60;}
function dur(m){var h=Math.floor(m/60),mm=m%60;return h?(h+" ч"+(mm?" "+mm+" мин":"")):mm+" мин";}
function plural(n,a,b,c){var x=n%100,y=n%10;return x>10&&x<20?c:y===1?a:y>=2&&y<=4?b:c;}
function nowMin(t){return t.getHours()*60+t.getMinutes();}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ext(a,b){var o={},k;for(k in a)o[k]=a[k];for(k in b)o[k]=b[k];return o;}
function byP(x,y){return x.p-y.p;}

// ---------- Подготовка данных ----------
var DATE_RE=/^\d{4}-\d\d-\d\d$/;
function valid(x){
  return !!x&&typeof x==="object"&&DATE_RE.test(x.anchor||"")&&DATE_RE.test(x.end||"")
    &&Array.isArray(x.bells)&&x.bells.length>0&&Array.isArray(x.lessons);
}
function prepare(x){
  ANCHOR=pd(x.anchor); ANCHOR_T=x.anchorType==="over"?"over":"under"; LAST=pd(x.end);
  // Первый день занятий: раньше него пар нет и календарь не листается
  FIRST=DATE_RE.test(x.start||"")?pd(x.start):null; FIRSTM=FIRST&&new Date(FIRST.getFullYear(),FIRST.getMonth(),1);
  PAIRS=[null].concat(x.bells);
  // Пятиминутка внутри пары задаётся в звонках явно: [начало, конец, начало перерыва, конец перерыва]
  function fill(l){var b=PAIRS[l.p];l.a=toMin(b[0]);l.b=toMin(b[1]);l.h1=b[2]&&b[3]?toMin(b[2]):null;l.h2=l.h1!==null?toMin(b[3]):null;return l;}
  P2=getRaw(P2KEY)==="1"&&!!(x.alt&&Array.isArray(x.alt.lessons));
  if(P2)x={anchor:x.anchor,anchorType:x.anchorType,start:x.start,end:x.end,bells:x.bells,session:x.session,lessons:JSON.parse(JSON.stringify(x.alt.lessons)),changes:JSON.parse(JSON.stringify(x.alt.changes||{}))};
  BYDAY=[[],[],[],[],[],[]];
  x.lessons.forEach(function(l){if(PAIRS[l.p]&&l.d>=0&&l.d<6)BYDAY[l.d].push(fill(l));});
  BYDAY.forEach(function(a){a.sort(byP);});
  CHANGES={};
  var ch=x.changes||{};
  for(var k in ch)if(Array.isArray(ch[k]))CHANGES[k]=ch[k].filter(function(c){return PAIRS[c.p];}).map(fill);

  SESSION=null; END_ALL=LAST;
  var s=x.session;
  if(s&&DATE_RE.test(s.from||"")&&DATE_RE.test(s.to||"")){
    SESSION={from:pd(s.from),to:pd(s.to),byDay:{}};
    (s.items||[]).forEach(function(it){
      if(!DATE_RE.test(it.date||""))return;
      it.time=it.time||"9:00"; it.m=toMin(it.time); if(!KINDS[it.kind])it.kind="other";
      (SESSION.byDay[it.date]=SESSION.byDay[it.date]||[]).push(it);
    });
    for(var dk in SESSION.byDay)SESSION.byDay[dk].sort(function(a,b){return a.m-b.m;});
    if(SESSION.to>END_ALL)END_ALL=SESSION.to;
  }
  LASTM=new Date(END_ALL.getFullYear(),END_ALL.getMonth(),1);
  dayCache={};
}

// Пары дня: постоянное расписание + замены и отмены на эту дату. Отменённые остаются в списке с пометкой.
var dayCache={};
function lessonsFor(d){
  var k=key(d); if(dayCache[k])return dayCache[k];
  return dayCache[k]=buildDay(d,k);
}
function buildDay(d,k){
  var wd=(d.getDay()+6)%7, ch=CHANGES[k], list=[], wt;
  if(wd<6&&d<=LAST&&!beforeStart(d)){wt=weekType(d);list=BYDAY[wd].filter(function(l){return (l.w==="all"||l.w===wt)&&(!l.from||k>=l.from);});}
  if(!ch)return list;
  var by={};
  list.forEach(function(l){by[l.p]=l;});
  (ch||[]).forEach(function(c){
    var base=by[c.p];
    if(c.cancel){if(base)by[c.p]=ext(base,{cancel:true});return;}
    if(c.ed&&base){by[c.p]=ext(base,{s:c.s,t:c.t,tch:c.tch,r:c.r,ed:true});return;} // разовая правка карточки
    by[c.p]=ext(c,{sub:base?"rep":"add",was:c.was||(base?base.s+(base.tch?", "+base.tch:""):"")});
  });
  return Object.keys(by).map(function(p){return by[p];}).sort(byP);
}
function active(list){return list.filter(function(l){return !l.cancel;});}
function itemsFor(d){return SESSION&&SESSION.byDay[key(d)]||[];}
function inSession(d){return !!SESSION&&d>=SESSION.from&&d<=SESSION.to;}
// Суббота показывается, только если на неё что-то стоит
function satBusy(mon){var s=addDays(mon,5);return lessonsFor(s).length>0||itemsFor(s).length>0;}
function daysIn(mon){return satBusy(mon)?6:5;}
function inStrip(d){var w=(d.getDay()+6)%7;return w<5||(w===5&&satBusy(mondayOf(d)));}
function studyDay(d){var x=day0(d);while(!inStrip(x))x=addDays(x,1);return x;} // выходные -> понедельник
function fmtRange(mon,n){var e=addDays(mon,n-1);
  return mon.getMonth()===e.getMonth()?mon.getDate()+"-"+e.getDate()+" "+MONF[mon.getMonth()]:mon.getDate()+" "+MON[mon.getMonth()]+" - "+e.getDate()+" "+MON[e.getMonth()];}
function weekInSession(mon){for(var i=0;i<6;i++)if(inSession(addDays(mon,i)))return true;return false;}

// ---------- Хранилище ----------
function load(k,def){try{var v=JSON.parse(localStorage.getItem(k));return v&&typeof v==="object"?v:def;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function getRaw(k){try{return localStorage.getItem(k);}catch(e){return null;}}
var NKEY="pary-notes-v1", SKEY="pary-settings-v1"; // ключи прежние, заметки и настройки сохраняются
var notes=load(NKEY,{});
var settings=load(SKEY,{}); if(settings.ui!=="old")settings.ui="new"; if(["dark","light"].indexOf(settings.theme)<0)settings.theme="system";

// Заметки: к практикам (кроме физкультуры) и к экзаменам, зачётам, консультациям
function canNote(l){return !l.cancel&&(!!l.kind||((l.t==="prac"||l.t==="mix")&&l.s!==FK));}
function noteKey(d,l){return key(d)+"|"+(l.kind?l.time:l.p)+"|"+l.s;}
function noteOf(d,l){return canNote(l)?notes[noteKey(d,l)]:undefined;}
var noteDays={};
function indexNotes(){noteDays={};for(var k in notes)noteDays[k.slice(0,10)]=1;}
indexNotes();
function dayHasNote(d){return !!noteDays[key(d)];}

// ---------- Общие куски разметки ----------
var TAGS={lec:'<span class="tag t-lec">Лекция</span>',prac:'<span class="tag t-prac">Практика</span>',mix:'<span class="tag t-mix">Лекция/Практика</span>'};
function tagHtml(l){
  if(l.kind)return '<span class="tag t-k-'+l.kind+'">'+KINDS[l.kind]+'</span>';
  return (TAGS[l.t]||"")+(l.cancel?'<span class="tag t-cancel">Отменена</span>':l.ed?'<span class="tag t-sub">Изменено</span>':l.sub==="rep"?'<span class="tag t-sub">Замена</span>':l.sub==="add"?'<span class="tag t-sub">Доп. пара</span>':"");
}
// Шкала пары: если в звонках есть пятиминутка, она показывается ровно в своё время, иначе пара идёт без перерыва
function pairBar(s,e,m,h1,h2){
  var pc=function(f){return Math.round(Math.max(0,Math.min(1,f))*100)+"%";};
  if(h1==null||h2==null||h1<=s||h2>=e||h2<=h1)return {split:false,h1:e,h2:e,html:'<div class="bar"><i style="width:'+pc((m-s)/(e-s))+'"></i></div>'};
  var f1=(m-s)/(h1-s), fb=m<h1?0:(m-h1)/(h2-h1), f2=m<h2?0:(m-h2)/(e-h2);
  return {split:true,h1:h1,h2:h2,html:'<div class="bar2"><span class="seg" style="flex:'+(h1-s)+'"><i style="width:'+pc(f1)+'"></i></span><span class="seg brk" style="flex:'+(h2-h1)+'"><i style="width:'+pc(fb)+'"></i></span><span class="seg" style="flex:'+(e-h2)+'"><i style="width:'+pc(f2)+'"></i></span></div>'};
}
function leftOf(b,m,e){return !b.split||m>=b.h2?["end",e-m]:m<b.h1?["half",b.h1-m]:["brk",b.h2-m];}
function isBig(a,b){return b.p-a.p===1&&b.a-a.b>=25;}
function noteAttrs(d,l){
  var lbl=l.kind?KINDS[l.kind]+" в "+l.time:l.p+" пара";
  return ' data-k="'+esc(noteKey(d,l))+'" data-t="'+esc(l.s)+'" data-l="'+esc(lbl)+'" data-d="'+d.getTime()+'"';
}
function stagger(el,cls){
  el.classList.remove("enter-l","enter-r","enter-up");
  if(!cls)return; void el.offsetWidth; el.classList.add(cls);
  Array.prototype.forEach.call(el.children,function(c,i){c.style.setProperty("--i",Math.min(i,8));});
}

// ---------- Полное расписание ----------
var sel=null, lastSel=null;

// cmp: выбранный день раньше сегодня (-1), сегодня (0), позже (1)
function gapHtml(kind,gs,ge,m,cmp){
  var on=cmp===0&&m>=gs&&m<ge, past=cmp<0||(cmp===0&&m>=ge);
  var fill=cmp<0?100:cmp>0?0:Math.max(0,Math.min(100,(m-gs)/(ge-gs)*100));
  var cls=(on?" on":"")+(past?" past":""), f='<span class="fill" style="width:'+fill.toFixed(1)+'%"></span>';
  if(kind==="small")return '<div class="pm'+cls+'">'+f+'<span class="pm-l">'+dur(ge-gs)+'</span><span>'+(on?"Перерыв, ещё "+dur(ge-m):"Перерыв")+'</span></div>';
  if(kind==="big")return '<div class="big'+cls+'">'+f+'<span class="big-i">'+I_CUP+'</span><div class="big-b"><div class="big-r"><b>Большой перерыв</b><span>'+(on?"ещё "+dur(ge-m):dur(ge-gs))+'</span></div><div class="big-s">'+fmtMin(gs)+' - '+fmtMin(ge)+'</div></div></div>';
  return '<div class="gap'+cls+'"><span>Окно '+dur(ge-gs)+(on?", ещё "+dur(ge-m):"")+'</span></div>';
}
function penBtn(d,l,hn){return canNote(l)?'<button class="pen"'+noteAttrs(d,l)+' aria-label="'+(hn?"Открыть заметку":"Добавить заметку")+'">'+I_PEN+'</button>':'';}
function fromTag(l,d){if(!d||!l.from||l.from!==key(d))return "";var f=pd(l.from);return '<span class="tag t-new">с '+f.getDate()+' '+MON[f.getMonth()]+'</span>';}
function cardBody(l,nt,extra,d){
  return '<div class="body"><div class="tags">'+tagHtml(l)+fromTag(l,d)+'</div>'
    +'<p class="subj">'+esc(l.s)+'</p>'
    +(l.tch?'<div class="who">'+esc(l.tch)+'</div>':'')
    +(l.was?'<div class="was">Вместо: '+esc(l.was)+'</div>':'')
    +(l.r?'<div class="room"><small>ауд. </small>'+esc(l.r)+'</div>':'')
    +(extra||"")+(nt?'<div class="peek">'+I_PEN+'<span>'+esc(nt.split("\n")[0])+'</span></div>':'')+'</div>';
}
function lessonCard(l,cmp,m){
  var s=l.a, e=l.b, isNow=!l.cancel&&cmp===0&&m>=s&&m<e, isPast=cmp<0||(cmp===0&&m>=e);
  var nt=noteOf(sel,l), hn=!!nt, prog="";
  if(isNow){
    var b=pairBar(s,e,m,l.h1,l.h2), lt=leftOf(b,m,e);
    prog=b.html+'<div class="left">'+(lt[0]==="half"?"До перерыва ":lt[0]==="brk"?"До конца перерыва ":"До конца пары осталось ")+dur(lt[1])+'</div>';
  }
  return '<article class="lesson'+(isNow?" now":"")+(isPast&&!hn?" past":"")+(hn?" has-note":"")+(l.cancel?" cancel":"")+'">'
    +penBtn(sel,l,hn)
    +'<div class="time"><span class="pn">'+l.p+' пара</span><b>'+PAIRS[l.p][0]+'</b><span>'+PAIRS[l.p][1]+'</span></div>'
    +cardBody(l,nt,prog,sel)+'</article>';
}
function itemCard(it,cmp){
  var nt=noteOf(sel,it), hn=!!nt;
  return '<article class="lesson'+(cmp<0&&!hn?" past":"")+(hn?" has-note":"")+'">'
    +penBtn(sel,it,hn)
    +'<div class="time"><span class="pn">начало</span><b>'+esc(it.time)+'</b></div>'
    +cardBody(it,nt)+'</article>';
}

function renderFull(){
  if(afterEnd(sel))sel=lastDay();
  if(beforeStart(sel))sel=firstDay();
  var t=new Date(), today=day0(t), m=nowMin(t), mon=mondayOf(sel), n=weeksBetween(studyDay(t),sel), nd=Math.min(daysIn(mon),Math.round((day0(END_ALL)-mon)/864e5)+1);
  $("rel").textContent=n===0?"эта неделя":n===1?"следующая неделя":n===-1?"прошлая неделя":n>1?"через "+n+" нед.":(-n)+" нед. назад";
  $("wtitle").textContent=weekInSession(mon)?"Сессия":weekType(sel)==="over"?"Над чертой":"Под чертой";
  $("range").textContent=fmtRange(mon,nd);

  var dh="";
  for(var i=0;i<nd;i++){
    var d=addDays(mon,i), c=active(lessonsFor(d)).length, its=itemsFor(d);
    var lbl=c?c+" п.":its.length?KSHORT[its[0].kind]:"·";
    dh+='<button'+(beforeStart(d)?' disabled':'')+' class="day'+(beforeStart(d)?" off":"")+(d.getTime()===sel.getTime()?" sel":"")+(d.getTime()===today.getTime()?" is-today":"")+(dayHasNote(d)?" has-note":"")
      +'" data-i="'+i+'" aria-label="'+DAYS_FULL[d.getDay()]+', '+d.getDate()+'"><span class="dn">'+DSHORT[i]+'</span><span class="dd">'+d.getDate()+'</span><span class="cnt">'+lbl+'</span></button>';
  }

// Редактор: ключ проверяется сразу по нажатию, с неподходящим дальше не пускаем
var REPO="CDN2041/raspisanie-BTEU-E-21", TOKEN_RE=/^(ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})$/;
function checkAdmin(t){
  if(!TOKEN_RE.test(t))return Promise.reject(new Error("Сохранённый ключ редактора неверный."));
  return fetch("https://api.github.com/repos/"+REPO,{headers:{"Authorization":"Bearer "+t,"Accept":"application/vnd.github+json"},cache:"no-store"})
    .then(function(r){
      if(r.status===401)throw new Error("Ключ редактора неверный или удалён на GitHub.");
      if(!r.ok)throw new Error("GitHub не дал доступ к репозиторию (ошибка "+r.status+").");
      var sc=r.headers.get("X-OAuth-Scopes");
      return r.json().then(function(j){
        var p=j.permissions||{};
        if(!(p.push||p.admin||p.maintain))throw new Error("У этого аккаунта больше нет доступа к редактору: его нет в соавторах репозитория.");
        if(sc!==null&&t.indexOf("ghp_")===0&&!/(^|,\s*)(public_repo|repo)(\s*,|$)/.test(sc))throw new Error("У ключа редактора нет права public_repo.");
      });
    },function(){throw {net:true,message:"Нет связи с GitHub. Редактор работает только с интернетом."};});
}
$("toAdmin").addEventListener("click",function(e){
  var t=getRaw(TOKEN_KEY), b=this;
  if(!t)return; // ключа нет: просто открываем экран входа
  e.preventDefault();
  if(b.getAttribute("aria-busy")==="true")return;
  b.setAttribute("aria-busy","true"); b.textContent="Проверяю ключ"; $("admErr").hidden=true;
  checkAdmin(t||"").then(function(){location.href=b.href;}).catch(function(err){
    b.removeAttribute("aria-busy"); b.textContent="Редактор";
    $("admErr").hidden=false; $("admErr").textContent=err.message;
    if(!err.net){try{localStorage.removeItem(TOKEN_KEY);}catch(x){}}
  });
});

$("toToday").onclick=function(){sel=studyDay(new Date());renderFull();};

// ---------- Загрузка расписания и автообновление ----------
function quiet(){return !swiping&&!document.querySelector(".sheet:not([hidden]),.cdlg:not([hidden])");}
// Таймер работает только пока приложение на экране, ровно в начале каждой минуты
var timer=null;
function tick(){clearTimeout(timer);if(document.hidden)return;
  timer=setTimeout(function(){if(quiet())refresh();tick();},60000-Date.now()%60000+200);}

var started=false;
function boot(x){
  try{prepare(x);}catch(e){return false;}
  if(!started){
    started=true; sel=studyDay(new Date()); shownDay=sel.getTime();
    show(settings.ui==="old"?"full":"home"); tick();
  }else if(view){normSel();refresh(true);}
  else show(settings.ui==="old"?"full":"home");
  return true;
}
function draft(){if(!DEMO)return null;var d=load(DRAFT_KEY,null);return valid(d)?d:null;}
var lastFetch=0;
function fetchSched(){
  lastFetch=Date.now();
  fetch(SCHED_URL,{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();}).then(function(txt){
    var x=JSON.parse(txt); if(!valid(x))throw new Error("bad");
    if(draft())return; // в демо черновик админки главнее файла
    var s=JSON.stringify(x), old=getRaw(CACHE_KEY);
    if(started&&s===old)return;
    var o=null; try{o=JSON.parse(old);}catch(e){}
    // Админ только что сохранил новую версию, а сайт ещё отдаёт старую: ждём, пока он обновится
    if(started&&o&&(+o.updated||0)>(+x.updated||0)&&Date.now()-(+o.updated)<15*60000)return;
    try{localStorage.setItem(CACHE_KEY,s);}catch(e){}
    if(!boot(x)&&!started)showMsg("Ошибка в расписании","Файл расписания повреждён. Сообщите старосте.",true);
  }).catch(function(){if(!started)showMsg("Нет связи","Расписание загрузится, когда появится интернет.",true);});
}

applyTheme();
var first=draft()||load(CACHE_KEY,null);
if(!(valid(first)&&boot(first)))showMsg("Загрузка","Получаем расписание");
fetchSched();
// 20 быстрых нажатий на номер версии включают или выключают режим «телефон 2»
(function(){
  var ver=document.querySelector(".ver"), n=0, t=null;
  if(!ver)return;
  ver.addEventListener("click",function(){
    clearTimeout(t); t=setTimeout(function(){n=0;},1500);
    if(++n<20)return; n=0;
    var on=getRaw(P2KEY)==="1";
    try{if(on)localStorage.removeItem(P2KEY);else localStorage.setItem(P2KEY,"1");}catch(e){}
    var txt=ver.textContent; ver.textContent=on?"·":"··"; setTimeout(function(){ver.textContent=txt;},900);
    var d=draft()||load(CACHE_KEY,null); if(valid(d))boot(d);
  });
})();
// Скрытый счётчик (в демо не считаем): всего устройств и уникальные устройства за каждые сутки
var COUNT_BASE="https://abacus.jasoncameron.dev/hit/cdn2041-raspisanie-bteu-e21/";
function countOnce(name,flagKey,flagVal){
  if(DEMO||getRaw(flagKey)===flagVal)return;
  fetch(COUNT_BASE+name).then(function(r){if(r.ok){try{localStorage.setItem(flagKey,flagVal);}catch(e){}}}).catch(function(){});
}
function countVisit(){countOnce("devices","pary-e21-counted","1");countOnce("d-"+key(new Date()),"pary-e21-counted-day",key(new Date()));}
countVisit();
document.addEventListener("visibilitychange",function(){if(!document.hidden)countVisit();}); // приложение могли не закрывать со вчера
document.addEventListener("visibilitychange",function(){
  if(document.hidden){clearTimeout(timer);return;}
  if(Date.now()-lastFetch>60000)fetchSched();
  if(started){if(quiet())refresh();tick();}
});
// Сохранили в админке в соседней вкладке: показываем сразу
window.addEventListener("storage",function(e){
  if(e.key!==DRAFT_KEY&&e.key!==CACHE_KEY)return;
  var d=draft()||load(CACHE_KEY,null); if(valid(d))boot(d);
});

})();
</script>

["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},{passive:false});});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
