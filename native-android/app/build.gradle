plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
  id "org.jetbrains.kotlin.plugin.compose"
}
android {
  namespace "by.cdn2041.pary"
  compileSdk 35
  defaultConfig {
    applicationId "by.cdn2041.pary"
    minSdk 26
    targetSdk 35
    versionCode 1000 + Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
    versionName "2." + (System.getenv("VERSION_CODE") ?: "1")
  }
  signingConfigs {
    release {
      storeFile file(System.getenv("KS_FILE") ?: "none.jks")
      storePassword System.getenv("KS_PASS")
      keyAlias "pary"
      keyPassword System.getenv("KS_PASS")
    }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.release }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = "17" }
  buildFeatures { compose true }
}
dependencies {
  def bom = platform("androidx.compose:compose-bom:2024.12.01")
  implementation bom
  implementation "androidx.compose.material3:material3"
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.material:material-icons-core"
  implementation "androidx.compose.foundation:foundation"
  implementation "androidx.activity:activity-compose:1.9.3"
  implementation "androidx.core:core-ktx:1.15.0"
  implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
  implementation "androidx.glance:glance-appwidget:1.1.1"
  implementation "androidx.glance:glance-material3:1.1.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
