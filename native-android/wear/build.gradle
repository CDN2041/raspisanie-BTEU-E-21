plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
  id "org.jetbrains.kotlin.plugin.compose"
}
android {
  namespace "by.cdn2041.pary.wear"
  compileSdk 35
  defaultConfig {
    applicationId "by.cdn2041.pary"
    minSdk 30
    targetSdk 34
    versionCode 2000 + Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
    versionName "2." + (System.getenv("VERSION_CODE") ?: "1")
  }
  signingConfigs {
    release {
      storeFile file(System.getenv("KS_FILE") ?: "none.jks")
      storePassword System.getenv("KS_PASS")
      keyAlias "pary"
      keyPassword System.getenv("KS_PASS")
    }
  }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = "17" }
  buildFeatures { compose true }
  sourceSets { main.java.srcDirs += "../shared" }
}
dependencies {
  def bom = platform("androidx.compose:compose-bom:2024.12.01")
  implementation bom
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.foundation:foundation"
  implementation "androidx.wear.compose:compose-material:1.4.0"
  implementation "androidx.wear.compose:compose-foundation:1.4.0"
  implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1"
  implementation "androidx.activity:activity-compose:1.9.3"
  implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
