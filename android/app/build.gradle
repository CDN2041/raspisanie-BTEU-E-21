plugins { id "com.android.application" }
android {
  namespace "by.cdn2041.pary"
  compileSdk 34
  defaultConfig {
    applicationId "by.cdn2041.pary"
    minSdk 24
    targetSdk 34
    versionCode (System.getenv("VERSION_CODE") ?: "1").toInteger()
    versionName "1." + (System.getenv("VERSION_CODE") ?: "1")
  }
  signingConfigs {
    release {
      storeFile file(System.getenv("KS_FILE") ?: "none.jks")
      storePassword System.getenv("KS_PASS")
      keyAlias "pary"
      keyPassword System.getenv("KS_PASS")
    }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.release }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
